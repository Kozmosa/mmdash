name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CADDY_VERSION: 2.11.4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Caddy
        run: |
          archive="caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          release_url="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}"
          curl --fail --location --silent --show-error --remote-name "${release_url}/${archive}"
          curl --fail --location --silent --show-error --remote-name "${release_url}/caddy_${CADDY_VERSION}_checksums.txt"
          grep " ${archive}$" "caddy_${CADDY_VERSION}_checksums.txt" | sha512sum --check
          sudo tar --extract --gzip --file "${archive}" --directory /usr/local/bin caddy
          caddy version
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen
      - run: pnpm check
      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: |
          git log --no-merges --format=%s "origin/${{ github.base_ref }}..HEAD" |
            while IFS= read -r message; do
              pnpm commit:check "$message"
            done
