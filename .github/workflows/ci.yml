name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Validate commit messages
        run: |
          git log --no-merges --format=%s "origin/${{ github.base_ref }}..HEAD" |
            while IFS= read -r message; do
              node scripts/check-commit-message.mjs "$message"
            done

  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # The generated-contract freshness test shells out to gofmt.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: |
            backend/go.sum
            box/go.sum
            go.work.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ts
      - run: pnpm test:ts
      - run: pnpm build:ts

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: |
            backend/go.sum
            box/go.sum
            go.work.sum
      - run: pnpm lint:go
      - run: pnpm test:go
      - run: pnpm build:go

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      # astral-sh/setup-uv publishes no floating major tag; pin exactly.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: pnpm lint:python
      - run: pnpm test:python
      - run: pnpm build:python

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CADDY_VERSION: "2.11.4"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # contracts:check regenerates the Go contract outputs through gofmt.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: |
            backend/go.sum
            box/go.sum
            go.work.sum
      - name: Install Caddy
        run: |
          archive="caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          release_url="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}"
          curl --fail --location --silent --show-error --remote-name "${release_url}/${archive}"
          curl --fail --location --silent --show-error --remote-name "${release_url}/caddy_${CADDY_VERSION}_checksums.txt"
          grep " ${archive}$" "caddy_${CADDY_VERSION}_checksums.txt" | sha512sum --check
          sudo tar --extract --gzip --file "${archive}" --directory /usr/local/bin caddy
          caddy version
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check
      - run: pnpm api:check
      - run: pnpm caddy:check
