name: Integration smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pixi-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.8

      - name: Start isolated services
        run: |
          set -euo pipefail
          mkdir -p .testenv/runtime/logs
          ./scripts/testenv.sh dev > .testenv/runtime/logs/ci-supervisor.log 2>&1 &
          echo $! > .testenv/runtime/ci-supervisor.pid
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:13000/projects > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 200 .testenv/runtime/logs/ci-supervisor.log || true
          exit 1

      - name: Run end-to-end smoke flow
        run: ./scripts/testenv.sh smoke

      - name: Stop isolated services
        if: always()
        run: ./scripts/testenv.sh stop

      - name: Upload isolated service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixi-smoke-logs
          path: .testenv/runtime/logs
          if-no-files-found: warn
