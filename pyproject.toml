[project]
name = "mmdash-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["workers/*"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["--basetemp=.testenv/pytest-workspace", "-p", "no:cacheprovider"]
testpaths = ["workers"]
timeout = 30
timeout_method = "thread"
session_timeout = 120
