    parameters:
      - { $ref: "#/components/parameters/BoxId" }
      - { $ref: "#/components/parameters/BoxTaskId" }
    post:
      tags: [Box, Artifact]
      summary: Submit the accepted Execution Bundle and Manifest hash for server-side result processing
      operationId: box.tasks.result
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BoxTaskResultRequest" }
      responses:
        "200":
          description: Archived result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
  /v1/boxes/{boxId}/tasks/{taskId}/artifact:
    parameters:
      - { $ref: "#/components/parameters/BoxId" }
      - { $ref: "#/components/parameters/BoxTaskId" }
    post:
      tags: [Box, Artifact]
      summary: Stream one verified execution-bundle.zip into the Core Artifact boundary
      operationId: box.tasks.artifact.upload
      parameters:
        - name: X-Mmdash-Artifact-SHA256
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
        - name: X-Mmdash-Execution-Epoch
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Mmdash-Artifact-Size
          in: header
          required: true
          schema:
            { type: integer, format: int64, minimum: 1, maximum: 5368709120 }
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Archived Artifact pointer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactPointer" }
