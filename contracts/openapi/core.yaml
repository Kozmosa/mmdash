          format: date-time
        published_at:
          type: string
          format: date-time
        failed_at:
          type: string
          format: date-time
        locked_by:
          type: string
        lease_expires_at:
          type: string
          format: date-time
        last_error:
          type: string
    EventDelivery:
      type: object
      additionalProperties: false
