        }
    get:
      tags: [Article]
      summary: Read one immutable Release and output manifest
      operationId: article.releases.get
      responses:
        "200":
          description: Immutable release.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ArticleRelease" } },
            }
  /v1/projects/{projectId}/article/templates:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Article]
      summary: List registered validated template Artifact versions
      operationId: article.templates.list
      responses:
        "200":
          description: Template list.
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/ArticleTemplateList" },
                },
            }
    post:
      tags: [Article]
      summary: Validate and register one immutable template Artifact version
      operationId: article.templates.create
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    $ref: "#/components/schemas/RegisterArticleTemplateRequest",
                  },
              },
          }
      responses:
        "202":
          description: Template validation registration.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ArticleTemplate" } },
            }
  /v1/projects/{projectId}/article/zotero:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Article]
      summary: Read redacted read-only Zotero binding
      operationId: article.zotero.get
      responses:
        "200":
          description: Zotero binding.
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/ArticleZoteroBinding" },
                },
            }
    put:
      tags: [Article]
      summary: Bind a read-only Zotero library and encrypted API key
      operationId: article.zotero.update
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    $ref: "#/components/schemas/UpdateArticleZoteroBindingRequest",
                  },
              },
          }
      responses:
        "200":
          description: Redacted Zotero binding.
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/ArticleZoteroBinding" },
                },
            }
    delete:
      tags: [Article]
      summary: Remove the project Zotero binding and secret
      operationId: article.zotero.delete
      responses: { "204": { description: Binding removed. } }
  /v1/projects/{projectId}/article/zotero/collections:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Article]
      summary: List collections in the configured Zotero library
      operationId: article.zotero.collections
      responses:
        "200":
          description: Zotero collections list.
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/ZoteroCollectionList" },
                },
            }
  /v1/projects/{projectId}/article/zotero/items:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - {
          name: collection,
          in: query,
          required: false,
          schema: { type: string, maxLength: 200 },
        }
      - {
          name: q,
          in: query,
          required: false,
          schema: { type: string, maxLength: 200 },
        }
    get:
      tags: [Article]
      summary: List or search items in the configured Zotero library
      operationId: article.zotero.items
      responses:
        "200":
          description: Zotero items list.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ZoteroItemList" } },
            }
  /v1/projects/{projectId}/article/zotero/search:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - {
          name: q,
          in: query,
          required: true,
          schema: { type: string, minLength: 1, maxLength: 200 },
        }
    get:
      tags: [Article]
      summary: Search the configured Zotero library by author, title, or keyword
      operationId: article.zotero.search
      responses:
        "200":
          description: Zotero search results.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ZoteroItemList" } },
            }
  /v1/projects/{projectId}/artifacts/{artifactId}/description:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/ArtifactId" }
    post:
      tags: [Article, Artifact, Model]
      summary: Request a non-blocking semantic description and recommended usage
      operationId: article.artifacts.describe
      requestBody:
        required: false
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/ArtifactSemanticDescriptionInput" }
      responses:
        "202":
          description: Description request accepted.
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "#/components/schemas/ArtifactSemanticDescriptionJob",
                    },
                },
            }
  /v1/internal/artifact-semantic-jobs/{jobId}/execute:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    post:
      tags: [Article, Artifact, Jobs]
      summary: Execute a claimed Artifact semantic-description Job through the Core Agent capability
      operationId: article.artifact_semantic_jobs.execute
      responses:
        "200":
          description: Strict semantic fields and Agent provenance for Job completion.
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "#/components/schemas/ArtifactSemanticDescriptionResult",
                    },
                },
            }
  /v1/internal/article-build-jobs/{jobId}/input:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    get:
      tags: [Article, Jobs]
      summary: Get Job-scoped Article build input and signed immutable input transfers
      operationId: article.build_jobs.input.get
      responses:
        "200":
          description: Job-scoped build input.
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/ArticleBuildJobInput" },
                },
            }
  /v1/internal/article-build-jobs/{jobId}/progress:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    post:
      tags: [Article, Jobs]
      summary: Persist monotonic progress for a claimed Article build Job
      operationId: article.build_jobs.progress.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateArticleBuildProgressRequest"
      responses:
        "200":
          description: Updated Article build.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleBuild" }
  /v1/internal/article-build-jobs/{jobId}/outputs/{role}:
    parameters:
      - { $ref: "#/components/parameters/JobId" }
      - {
          name: role,
          in: path,
          required: true,
          schema: { $ref: "#/components/schemas/ArticleBuildOutputRole" },
        }
    post:
      tags: [Article, Artifact, Jobs]
      summary: Stream one verified build output through Core into Artifact
      operationId: article.build_jobs.outputs.upload
      parameters:
        - {
            name: X-Mmdash-Artifact-SHA256,
            in: header,
            required: true,
            schema: { type: string, pattern: "^[0-9a-f]{64}$" },
          }
        - {
            name: X-Mmdash-Filename,
            in: header,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 255 },
          }
        - {
            name: Content-Type,
            in: header,
            required: true,
            schema: { type: string, minLength: 3, maxLength: 255 },
          }
        - {
            name: Content-Length,
            in: header,
            required: true,
            schema: { type: integer, format: int64, minimum: 1 },
          }
      requestBody:
        required: true
        content:
          {
            application/octet-stream:
              { schema: { type: string, format: binary } },
          }
      responses:
        "201":
          description: Archived output pointer.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ArticleBuildOutput" } },
            }
  /v1/internal/experiment-result-jobs/{jobId}/input:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    get:
      tags: [Experiment, Artifact, Jobs]
      summary: Get a Job-scoped immutable Experiment Bundle transfer
      operationId: experiment.result_jobs.input.get
      responses:
        "200":
          description: Frozen Experiment metadata and short-lived Bundle transfer.
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/ExperimentResultJobInput" },
                },
            }
  /v1/internal/experiment-result-jobs/{jobId}/finalize:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    post:
      tags: [Experiment, Artifact, Repo, Jobs]
      summary: Finalize a Worker-validated Experiment Bundle through Artifact and Repo
      operationId: experiment.result_jobs.finalize
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    $ref: "#/components/schemas/FinalizeExperimentResultRequest",
                  },
              },
          }
      responses:
        "200":
          description: Result Commit was pushed, verified, and bound.
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "#/components/schemas/FinalizeExperimentResultResponse",
                    },
                },
            }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or opaque token
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelQuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModelSnapshotId:
      name: snapshotId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InboxItemId:
      name: inboxItemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationChannelKey:
      name: channelKey
      in: path
      required: true
      schema:
        {
          type: string,
          enum: [notification.feishu_webhook, notification.generic_webhook],
        }
    NotificationTypeKey:
      name: typeKey
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    NotificationDeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactFolderId:
      name: folderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactUploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactVersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactSignedToken:
      name: signedToken
      in: path
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 4096
    ArtifactKind:
      name: kind
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ArtifactKind"
    ArtifactSource:
      name: source
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ArtifactSource"
    ArtifactStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ArtifactStatus"
    ArtifactTag:
      name: tag
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ArtifactLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    CommitSha:
      name: commitSha
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
    CheckoutId:
      name: checkoutId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HookId:
      name: hookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RepoWorkspace:
      name: workspace
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/RepoWorkspaceKind"
    RepoRevision:
      name: revision
      in: query
      required: true
      description: A full commit SHA after the initial workspace resolution.
      schema:
        type: string
        pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
    RepoPath:
      name: path
      in: query
      required: false
      schema:
        type: string
        maxLength: 4096
        default: ""
    RequiredRepoPath:
      name: path
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
    RepoLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    RepoCommitLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentInstanceId:
      name: agentInstanceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 500
    AgentTokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TypeKey:
      name: typeKey
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_.-]*$"
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExperimentId:
      name: experimentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BoxId:
      name: boxId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BoxTaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExperimentLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  responses:
    Error:
      description: Stable Core error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    PersistArticleDraftRequest:
      type: object
      additionalProperties: false
      required:
        [
          expected_revision,
          yjs_update,
          state_vector,
          tiptap_json,
          actor_kind,
          provenance,
        ]
      properties:
        expected_revision: { type: integer, format: int64, minimum: 0 }
        yjs_update:
          {
            type: string,
            minLength: 1,
            maxLength: 16777216,
            description: Base64-encoded Yjs document update.,
          }
        state_vector:
          {
            type: string,
            minLength: 1,
            maxLength: 1048576,
            description: Base64-encoded Yjs state vector.,
          }
        tiptap_json: { type: object, additionalProperties: true }
        actor_kind: { type: string, enum: [human, ai, restore] }
        provenance: { type: object, additionalProperties: true }
    CreateArticlePatchRequest:
      type: object
      additionalProperties: false
      required: [base_revision, patch, rationale, provenance]
      properties:
        base_revision: { type: integer, format: int64, minimum: 0 }
        patch: { type: object, additionalProperties: true }
        rationale: { type: string, minLength: 1, maxLength: 4000 }
        provenance: { type: object, additionalProperties: true }
    ReviewArticlePatchRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [accepted, rejected] }
        yjs_update: { type: string, minLength: 1, maxLength: 16777216 }
        state_vector: { type: string, minLength: 1, maxLength: 1048576 }
        tiptap_json: { type: object, additionalProperties: true }
        expected_revision: { type: integer, format: int64, minimum: 0 }
    CreateArticleReferenceRequest:
      type: object
      additionalProperties: false
      required: [reference_type, source_object_id, source_version_id, title]
      properties:
        reference_type:
          {
            type: string,
            enum:
              [problem, model_snapshot, experiment_result, artifact, zotero],
          }
        source_object_id: { type: string, minLength: 1, maxLength: 255 }
        source_version_id: { type: string, minLength: 1, maxLength: 255 }
        title: { type: string, minLength: 1, maxLength: 500 }
        citation_key:
          { type: string, pattern: "^[A-Za-z][A-Za-z0-9_:+.-]{0,99}$" }
        metadata: { type: object, additionalProperties: true }
    CreateArticleCommitRequest:
      type: object
      additionalProperties: false
      required: [draft_revision, message]
      properties:
        draft_revision: { type: integer, format: int64, minimum: 1 }
        message: { type: string, minLength: 1, maxLength: 500 }
        idempotency_key: { type: string, minLength: 1, maxLength: 200 }
    CreateArticleBuildRequest:
      type: object
      additionalProperties: false
      required:
        [commit_id, template_id, engine, bibliography_tool, idempotency_key]
      properties:
        commit_id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        engine: { type: string, enum: [auto, pdflatex, xelatex, lualatex] }
        bibliography_tool: { type: string, enum: [auto, bibtex, biber, none] }
        idempotency_key: { type: string, minLength: 1, maxLength: 200 }
    CreateArticlePreviewBuildRequest:
      type: object
      additionalProperties: false
      required: [draft_revision, template_id, engine, bibliography_tool]
      properties:
        draft_revision: { type: integer, format: int64, minimum: 1 }
        template_id: { type: string, format: uuid }
        engine: { type: string, enum: [auto, pdflatex, xelatex, lualatex] }
        bibliography_tool: { type: string, enum: [auto, bibtex, biber, none] }
    CreateArticleReleaseRequest:
      type: object
      additionalProperties: false
      required: [commit_id, build_id, tag, title, notes]
      properties:
        commit_id: { type: string, format: uuid }
        build_id: { type: string, format: uuid }
        tag: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$" }
        title: { type: string, minLength: 1, maxLength: 255 }
        notes: { type: string, maxLength: 10000 }
    CreateArticlePublicationRequest:
      type: object
      additionalProperties: false
      required:
        [
          draft_revision,
          message,
          template_id,
          engine,
          bibliography_tool,
          tag,
          title,
          notes,
          idempotency_key,
        ]
      properties:
        draft_revision: { type: integer, format: int64, minimum: 1 }
        message: { type: string, minLength: 1, maxLength: 500 }
        template_id: { type: string, format: uuid }
        engine: { type: string, enum: [auto, pdflatex, xelatex, lualatex] }
        bibliography_tool: { type: string, enum: [auto, bibtex, biber, none] }
        tag: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$" }
        title: { type: string, minLength: 1, maxLength: 255 }
        notes: { type: string, maxLength: 10000 }
        idempotency_key: { type: string, minLength: 1, maxLength: 200 }
    RegisterArticleTemplateRequest:
      type: object
      additionalProperties: false
      required: [artifact_id, version_id, manifest]
      properties:
        artifact_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        manifest: { $ref: "#/components/schemas/ArticleTemplateManifest" }
    UpdateArticleZoteroBindingRequest:
      type: object
      additionalProperties: false
      required: [library_type, library_id, api_key]
      properties:
        library_type: { type: string, enum: [user, group] }
        library_id: { type: string, minLength: 1, maxLength: 100 }
        collection_key: { type: string, maxLength: 100 }
        api_key:
          { type: string, minLength: 1, maxLength: 1000, writeOnly: true }
    ArticleTemplateManifest:
      type: object
      additionalProperties: false
      required:
        [
          schema_version,
          name,
          version,
          entrypoint,
          output,
          content_target,
          bibliography_target,
          engine,
          bibliography_tool,
        ]
      properties:
        schema_version: { type: string, const: "1.0" }
        name: { type: string }
        version: { type: string }
        entrypoint: { type: string }
        output: { type: string }
        content_target: { type: string }
        bibliography_target: { type: string }
        engine: { type: string, enum: [auto, pdflatex, xelatex, lualatex] }
        bibliography_tool: { type: string, enum: [auto, bibtex, biber, none] }
    ArticleBlock:
      type: object
      additionalProperties: false
      required:
        [block_id, node_type, ordinal, text, attrs, tag, provenance, updated_at]
      properties:
        block_id: { type: string, format: uuid }
        node_type: { type: string }
        ordinal: { type: integer, minimum: 0 }
        text: { type: string }
        attrs: { type: object, additionalProperties: true }
        tag:
          {
            type: string,
            enum:
              [ai_draft, human_draft, ai_revision, human_revision, reviewed],
          }
        provenance: { type: object, additionalProperties: true }
        updated_at: { type: string, format: date-time }
    ChapterTagStatus:
      type: string
      enum: [unedited, unreviewed, reviewed, needs_review]
    ArticleChapterTag:
      type: object
      additionalProperties: false
      required:
        [
          chapter_tag_id,
          project_id,
          heading_block_id,
          status,
          heading_block_type,
          heading_fingerprint,
          updated_by,
          updated_at,
        ]
      properties:
        chapter_tag_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        heading_block_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ChapterTagStatus" }
        heading_block_type: { type: string }
        heading_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
        stale_reason: { type: string }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
        reviewed_by: { type: string }
        reviewed_at: { type: string, format: date-time }
    ArticleChapterTagList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ArticleChapterTag" }
    CreateArticleChapterTagRequest:
      type: object
      additionalProperties: false
      required: [heading_block_id]
      properties:
        heading_block_id: { type: string, format: uuid }
        status: { type: string, enum: [unedited, unreviewed] }
    UpdateArticleChapterTagRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [unedited, unreviewed] }
    ArticleDraft:
      type: object
      additionalProperties: false
      required:
        [
          project_id,
          draft_revision,
          yjs_update,
          state_vector,
          tiptap_json,
          markdown,
          blocks,
          sync_status,
          updated_at,
        ]
