    ArticleBuildJobInput:
      type: object
      additionalProperties: false
      required:
        [
          build_id,
          project_id,
          build_kind,
          manuscript,
          references_bib,
          article_manifest,
          template,
          engine,
          bibliography_tool,
          limits,
          toolchain,
        ]
      properties:
        build_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        build_kind: { type: string, enum: [preview, formal, template_test] }
        manuscript: { type: string, maxLength: 5000000 }
        references_bib: { type: string, maxLength: 5000000 }
        article_manifest: { type: object, additionalProperties: true }
        template:
          type: object
          additionalProperties: false
          required: [artifact_id, version_id, manifest, transfer]
          properties:
            artifact_id: { type: string, format: uuid }
            version_id: { type: string, format: uuid }
            manifest: { $ref: "#/components/schemas/ArticleTemplateManifest" }
            transfer: { $ref: "#/components/schemas/ArtifactTransferGrant" }
        resources:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required:
              [
                artifact_id,
                version_id,
                title,
                filename,
                mime_type,
                size_bytes,
                sha256,
                transfer,
              ]
            properties:
              artifact_id: { type: string, format: uuid }
              version_id: { type: string, format: uuid }
              title: { type: string, minLength: 1, maxLength: 255 }
              filename: { type: string, minLength: 1, maxLength: 255 }
              mime_type: { type: string, minLength: 3, maxLength: 255 }
              size_bytes:
                { type: integer, format: int64, minimum: 1, maximum: 536870912 }
              sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
              transfer: { $ref: "#/components/schemas/ArtifactTransferGrant" }
        engine: { type: string, enum: [auto, pdflatex, xelatex, lualatex] }
        bibliography_tool: { type: string, enum: [auto, bibtex, biber, none] }
        limits:
          type: object
          additionalProperties: false
          required:
            [timeout_seconds, memory_bytes, disk_bytes, output_bytes, network]
          properties:
            timeout_seconds: { type: integer, minimum: 1, maximum: 600 }
            memory_bytes:
              {
                type: integer,
                format: int64,
                minimum: 134217728,
                maximum: 2147483648,
              }
            disk_bytes:
              {
                type: integer,
                format: int64,
                minimum: 134217728,
                maximum: 4294967296,
              }
            output_bytes:
              { type: integer, format: int64, minimum: 1, maximum: 536870912 }
            network: { type: string, const: none }
        toolchain:
          type: object
          additionalProperties: false
          required: [pandoc, latexmk, texlive]
          properties:
            pandoc: { type: string, const: "pandoc 2.17.1.1" }
            latexmk: { type: string, const: "Version 4.79" }
            texlive: { type: string, const: "TeX Live 2022/Debian" }
