        - delivery_key
        - status
        - attempts
        - max_attempts
        - available_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        consumer_name:
          type: string
        delivery_key:
          type: string
        status:
          type: string
          enum: [pending, processing, succeeded, failed]
        attempts:
          type: integer
        max_attempts:
          type: integer
        available_at:
          type: string
          format: date-time
        locked_by:
          type: string
        lease_expires_at:
          type: string
          format: date-time
        last_error:
