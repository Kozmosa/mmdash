openapi: 3.1.0
info:
  title: mmdash Core API
  version: 0.1.0
  description: |
    Stable HTTP contract exposed by the Go Core Server. Browser clients use it
    through Web BFF, and Agent clients use it through MCP Gateway.
servers:
  - url: http://localhost:8080
    description: Local Core Server
tags:
  - name: Health
    description: Process liveness and dependency readiness.
  - name: System
    description: Core platform metadata.
  - name: Engineering
    description: Non-domain endpoints used to verify the technical baseline.
  - name: Auth
    description: Users, sessions, and revocable access credentials.
  - name: Projects
    description: Collaborative projects, membership, roles, and permissions.
  - name: Repo
    description: Managed Git repositories, immutable object reads, synchronization, and internal writes.
  - name: Artifact
    description: Project-scoped immutable file versions, multipart transfer, preview, and trash.
    x-error-codes:
      - ARTIFACT_NOT_FOUND
      - ARTIFACT_UPLOAD_EXPIRED
      - ARTIFACT_UPLOAD_INCOMPLETE
      - ARTIFACT_SIZE_MISMATCH
      - ARTIFACT_HASH_MISMATCH
      - ARTIFACT_TOO_LARGE
      - ARTIFACT_PART_INVALID
      - ARTIFACT_PART_MISSING
      - ARTIFACT_UPLOAD_ABORTED
      - ARTIFACT_UPLOAD_CONFLICT
      - ARTIFACT_KIND_INVALID
      - ARTIFACT_SOURCE_INVALID
      - ARTIFACT_TAG_INVALID
      - ARTIFACT_MIME_NOT_ALLOWED
      - ARTIFACT_NOT_AVAILABLE
      - ARTIFACT_PREVIEW_UNAVAILABLE
      - ARTIFACT_STORAGE_UNAVAILABLE
      - ARTIFACT_NOT_TRASHED
      - ARTIFACT_PURGE_CONFLICT
  - name: Settings
    description: Typed system/project configuration, redacted secrets, and connection tests.
  - name: Jobs
    description: Durable asynchronous jobs and the authenticated Worker protocol.
  - name: Events
    description: Outbox inspection, registered consumers, and explicit replay.
  - name: Data Hub
    description: Cross-module object discovery, activity, and human-confirmed project context.
  - name: Audit
    description: Append-only security/activity audit ingestion and authorized search.
  - name: Progress
    description: Authoritative milestones, tasks, dependencies, reminders, and human-reviewed proposals.
  - name: Notification
    description: User Inbox, project notification routing, and safe delivery diagnostics.
  - name: Observability
    description: Service metrics and diagnostic metadata.
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Check whether the Core process is alive
      operationId: health.live
      security: []
      responses:
        "200":
          description: The Core process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /health/ready:
    get:
      tags: [Health]
      summary: Check Core dependency readiness
      operationId: health.ready
      security: []
      responses:
        "200":
          description: PostgreSQL and object storage are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: One or more dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /openapi.yaml:
    get:
      tags: [System]
      summary: Read the running Core OpenAPI contract
      operationId: system.openapi.get
      security: []
      responses:
        "200":
          description: The canonical Core OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
  /metrics:
    get:
      tags: [Observability]
      summary: Read bounded-label Prometheus metrics
      operationId: observability.metrics.get
      security: []
      responses:
        "200":
          description: Prometheus text exposition for Core.
          content:
            text/plain:
              schema:
                type: string
  /v1/example:
    get:
      tags: [Engineering]
      summary: Verify the example module and PostgreSQL path
      operationId: example.check
      security: []
      responses:
        "200":
          description: PostgreSQL is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleCheck"
        "503":
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      operationId: auth.login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: A revocable browser session was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a session by using its refresh token
      operationId: auth.refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Access and refresh tokens were rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/device/authorize:
    post:
      tags: [Auth]
      summary: Start a CLI device authorization
      operationId: auth.device.authorize
      security: []
      responses:
        "201":
          description: One-time device and user codes were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorization"
  /v1/auth/device/verify:
    post:
      tags: [Auth]
      summary: Approve or deny a CLI device authorization
      operationId: auth.device.verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceVerificationRequest"
      responses:
        "204":
          description: Device authorization decision recorded.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/auth/device/token:
    post:
      tags: [Auth]
      summary: Exchange an approved device code for a CLI session
      operationId: auth.device.token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTokenRequest"
      responses:
        "200":
          description: Approved device authorization exchanged once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/auth/register:
    post:
      tags: [Auth]
      summary: Register an active user, optionally through an invitation
      operationId: auth.register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User and browser session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "409":
          $ref: "#/components/responses/Error"
  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current browser session
      operationId: auth.logout
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Resolve the current identity
      operationId: auth.me
      responses:
        "200":
          description: Current authenticated identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Auth]
      summary: Update the current user's profile
      operationId: auth.me.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /v1/auth/me/password:
    post:
      tags: [Auth]
      summary: Change the current user's password
      operationId: auth.me.password.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and other sessions revoked.
  /v1/auth/invitations/preview:
    post:
      tags: [Auth]
      summary: Preview an invitation without consuming it
      operationId: auth.invitations.preview
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: Valid invitation metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectInvitation"
  /v1/auth/invitations/accept:
    post:
      tags: [Auth]
      summary: Accept an invitation as the current user
      operationId: auth.invitations.accept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: Membership created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
  /v1/auth/invitations/reject:
    post:
      tags: [Auth]
      summary: Reject and permanently invalidate an invitation
      operationId: auth.invitations.reject
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "204":
          description: Invitation rejected.
  /v1/auth/tokens:
    get:
      tags: [Auth]
      summary: List token metadata owned by the current user
      operationId: auth.tokens.list
      responses:
        "200":
          description: Token metadata without secrets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccessToken"
    post:
      tags: [Auth]
      summary: Issue an API, Agent, or Box token
      operationId: auth.tokens.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token secret returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedToken"
  /v1/auth/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [Auth]
      summary: Revoke an access token
      operationId: auth.tokens.revoke
      responses:
        "204":
          description: Token revoked.
        "404":
          $ref: "#/components/responses/Error"
  /v1/projects:
    get:
      tags: [Projects]
      summary: List projects visible to the current identity
      operationId: projects.list
      parameters:
        - name: include_archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Visible collaborative projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
    post:
      tags: [Projects]
      summary: Create a collaborative project
      operationId: projects.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created with the caller as owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /v1/projects/trash:
    get:
      tags: [Projects]
      summary: List recoverable projects owned by the current user
      operationId: projects.trash.list
      responses:
        "200":
          description: Owner projects that remain inside their recovery window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
  /v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Get a project
      operationId: projects.get
      responses:
        "200":
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Projects]
      summary: Update or archive a project
      operationId: projects.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      tags: [Projects]
      summary: Move a project to the owner's recycle bin
      operationId: projects.trash
      responses:
        "204":
          description: Project moved to the recycle bin for 30 days.
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/restore:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Projects]
      summary: Restore an owned project from the recycle bin
      operationId: projects.restore
      responses:
        "200":
          description: Restored project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: List project collaborators
      operationId: projects.members.list
      responses:
        "200":
          description: Project team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
  /v1/projects/{projectId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [Projects]
      summary: Change a collaborator's role or transfer ownership
      description: >
        An owner role cannot be changed directly. Setting another existing
        collaborator's role to owner atomically transfers ownership from the
        caller and changes the caller to maintainer.
      operationId: projects.members.upsert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectMemberRequest"
      responses:
        "200":
          description: Updated collaborator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
    delete:
      tags: [Projects]
      summary: Remove a collaborator
      description: Owners must transfer ownership before they can be removed.
      operationId: projects.members.remove
      responses:
        "204":
          description: Collaborator removed.
        "409":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/invitations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: List project invitations
      operationId: projects.invitations.list
      responses:
        "200":
          description: Project invitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
    post:
      tags: [Projects]
      summary: Invite an email address to the project
      operationId: projects.invitations.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created; token is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedInvitation"
        "409":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Projects]
      summary: Revoke a pending invitation
      operationId: projects.invitations.revoke
      responses:
        "204":
          description: Invitation revoked.
  /v1/projects/{projectId}/permissions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Get the current identity's effective project permissions
      operationId: projects.permissions.get
      responses:
        "200":
          description: Effective role and permission names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPermissions"
  /v1/projects/{projectId}/artifacts/uploads:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Artifact]
      summary: Initialize the first immutable Version and its multipart upload
      operationId: artifact.uploads.initialize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactInitializeUploadRequest"
      responses:
        "201":
          description: Artifact, pending Version, and upload session initialized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactUploadSession"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/artifacts/uploads/{uploadId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactUploadId"
    get:
      tags: [Artifact]
      summary: Recover an authorized upload session and its completed parts
      operationId: artifact.uploads.get
      responses:
        "200":
          description: Application upload state without provider identifiers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactUploadSession"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Artifact]
      summary: Cancel and abort an unconfirmed multipart upload idempotently
      operationId: artifact.uploads.abort
      responses:
        "204":
          description: Upload aborted or already in an aborted terminal state.
        "409":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/artifacts/uploads/{uploadId}/parts/sign:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactUploadId"
    post:
      tags: [Artifact]
      summary: Sign a bounded on-demand batch of multipart part PUTs
      operationId: artifact.uploads.parts.sign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactSignPartsRequest"
      responses:
        "200":
          description: Short-lived direct or Local proxy transfer grants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactPartGrantList"
        "409":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/artifacts/uploads/{uploadId}/confirm:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactUploadId"
    post:
      tags: [Artifact]
      summary: Complete multipart state and verify full size and SHA-256
      operationId: artifact.uploads.confirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactConfirmUploadRequest"
      responses:
        "200":
          description: Idempotent confirmation result for an already completed upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDetail"
        "201":
          description: Verified immutable Version is now available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDetail"
        "409":
          $ref: "#/components/responses/Error"
  /v1/artifact-transfers/{signedToken}:
    parameters:
      - $ref: "#/components/parameters/ArtifactSignedToken"
    get:
      tags: [Artifact]
      summary: Stream one signed Local download or Worker input
      operationId: artifact.transfers.get
      security: []
      responses:
        "200":
          description: Bounded byte stream authorized by the short-lived token.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
    put:
      tags: [Artifact]
      summary: Stream one signed Local multipart part or Worker preview output
      operationId: artifact.transfers.put
      security: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Stream consumed and verified without buffering the full body.
        "400":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/artifacts:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Artifact]
      summary: List active Project Artifacts with fixed classification filters
      operationId: artifact.list
      parameters:
        - $ref: "#/components/parameters/ArtifactKind"
        - $ref: "#/components/parameters/ArtifactSource"
        - $ref: "#/components/parameters/ArtifactStatus"
        - $ref: "#/components/parameters/ArtifactTag"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/ArtifactLimit"
      responses:
        "200":
          description: Cursor page of active Artifacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactPage"
  /v1/projects/{projectId}/artifacts/trash:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Artifact]
      summary: List recoverable trashed Project Artifacts
      operationId: artifact.trash.list
      parameters:
        - $ref: "#/components/parameters/ArtifactKind"
        - $ref: "#/components/parameters/ArtifactTag"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/ArtifactLimit"
      responses:
        "200":
          description: Cursor page of trashed Artifacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactPage"
  /v1/projects/{projectId}/artifacts/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactId"
    get:
      tags: [Artifact]
      summary: Read Artifact metadata and its current immutable Version
      operationId: artifact.get
      responses:
        "200":
          description: Artifact detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDetail"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Artifact]
      summary: Update editable Artifact display metadata
      operationId: artifact.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactUpdateRequest"
      responses:
        "200":
          description: Updated Artifact detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDetail"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Artifact]
      summary: Move an active Artifact to recoverable trash
      operationId: artifact.trash
      responses:
        "204":
          description: Artifact moved to trash idempotently.
        "404":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/artifacts/{artifactId}/versions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactId"
    get:
      tags: [Artifact]
      summary: List every retained immutable Version
      operationId: artifact.versions.list
      responses:
        "200":
          description: Versions ordered by descending version number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactVersionList"
  /v1/projects/{projectId}/artifacts/{artifactId}/versions/uploads:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactId"
    post:
      tags: [Artifact]
      summary: Initialize a new immutable Version and multipart upload
      operationId: artifact.versions.uploads.initialize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactInitializeVersionUploadRequest"
