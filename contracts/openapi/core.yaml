          type: string
          format: date-time
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionCheck"
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, timed_out]
    Job:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - job_type
        - payload
        - status
        - priority
        - attempts
        - max_attempts
        - available_at
        - timeout_seconds
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        job_type:
          type: string
          pattern: "^[a-z][a-z0-9]*(\\.[a-z][a-z0-9]*)+$"
        payload:
          type: object
          additionalProperties: true
        status:
          $ref: "#/components/schemas/JobStatus"
        priority:
          type: integer
        idempotency_key:
          type: string
        attempts:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        available_at:
          type: string
          format: date-time
        timeout_seconds:
          type: integer
          minimum: 1
        timeout_at:
          type: string
          format: date-time
        locked_by:
          type: string
        lease_expires_at:
          type: string
          format: date-time
        cancel_requested_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        result:
          type: object
          additionalProperties: true
        error_code:
          type: string
        error_message:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateJobRequest:
      type: object
      additionalProperties: false
      required: [project_id, job_type, payload]
      properties:
        project_id:
          type: string
          format: uuid
        job_type:
          type: string
          pattern: "^[a-z][a-z0-9]*(\\.[a-z][a-z0-9]*)+$"
        payload:
          type: object
          additionalProperties: true
        priority:
          type: integer
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 500
        max_attempts:
          type: integer
          minimum: 1
          maximum: 100
        available_at:
          type: string
          format: date-time
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 86400
    ClaimJobRequest:
      type: object
      additionalProperties: false
      required: [worker_id, job_types]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 200
        job_types:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            pattern: "^[a-z][a-z0-9]*(\\.[a-z][a-z0-9]*)+$"
        lease_seconds:
          type: integer
          minimum: 10
          maximum: 900
    JobClaim:
      type: object
      additionalProperties: false
      required: [job]
      properties:
        job:
          oneOf:
            - $ref: "#/components/schemas/Job"
            - type: "null"
    WorkerHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [worker_id, version, capabilities]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 200
        version:
          type: string
          minLength: 1
        capabilities:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
    RenewJobLeaseRequest:
      type: object
      additionalProperties: false
      required: [worker_id, lease_seconds]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 200
        lease_seconds:
          type: integer
          minimum: 10
          maximum: 900
    AppendJobLogRequest:
      type: object
      additionalProperties: false
      required: [worker_id, level, message]
