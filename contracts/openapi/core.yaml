      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Cursor-paginated activity projections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataActivityPage"
  /v1/data/projects/{projectId}/context:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Data Hub]
      summary: List human-confirmed project context
