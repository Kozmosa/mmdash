components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or opaque token
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InboxItemId:
      name: inboxItemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationChannelKey:
      name: channelKey
      in: path
      required: true
      schema:
        {
          type: string,
          enum: [notification.feishu_webhook, notification.generic_webhook],
        }
    NotificationTypeKey:
      name: typeKey
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    NotificationDeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactUploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactVersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactSignedToken:
      name: signedToken
      in: path
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 4096
    ArtifactKind:
      name: kind
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ArtifactKind"
    ArtifactSource:
      name: source
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ArtifactSource"
    ArtifactStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ArtifactStatus"
    ArtifactTag:
      name: tag
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ArtifactLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    CommitSha:
      name: commitSha
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
    CheckoutId:
      name: checkoutId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HookId:
      name: hookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RepoWorkspace:
      name: workspace
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/RepoWorkspaceKind"
    RepoRevision:
      name: revision
      in: query
      required: true
      description: A full commit SHA after the initial workspace resolution.
      schema:
        type: string
        pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
    RepoPath:
      name: path
      in: query
      required: false
      schema:
        type: string
        maxLength: 4096
        default: ""
    RequiredRepoPath:
      name: path
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
    RepoLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    RepoCommitLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TypeKey:
      name: typeKey
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_.-]*$"
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Stable Core error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    User:
      type: object
      additionalProperties: false
      required: [id, email, display_name, status, system_role, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        system_role:
          type: string
          enum: [admin, member]
        created_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 32
          maxLength: 4096
    DeviceAuthorization:
      type: object
      additionalProperties: false
      required:
        [
          device_code,
          user_code,
          verification_uri,
          verification_uri_complete,
          expires_at,
          interval,
        ]
      properties:
        device_code:
          type: string
          minLength: 32
          maxLength: 4096
        user_code:
          type: string
          pattern: "^[A-Z0-9]{4}-[A-Z0-9]{4}$"
        verification_uri:
          type: string
          format: uri
        verification_uri_complete:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        interval:
          type: integer
          minimum: 1
          maximum: 30
    DeviceVerificationRequest:
      type: object
      additionalProperties: false
      required: [user_code, approve]
      properties:
        user_code:
          type: string
          pattern: "^[A-Za-z0-9]{4}-[A-Za-z0-9]{4}$"
        approve:
          type: boolean
    DeviceTokenRequest:
      type: object
      additionalProperties: false
      required: [device_code]
      properties:
        device_code:
          type: string
          minLength: 32
          maxLength: 4096
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, display_name, password]
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 8
        invitation_token:
          type: string
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
        current_password:
          type: string
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
    InvitationTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    LoginResult:
      type: object
      additionalProperties: false
      required: [access_token, expires_at, session_id, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          type: string
          format: date-time
        session_id:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
    Identity:
      type: object
      additionalProperties: false
      required: [kind, user]
      properties:
        kind:
          type: string
          enum: [session, api, agent, box]
        project_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        token_id:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
    AccessToken:
      type: object
      additionalProperties: false
      required: [id, user_id, kind, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [api, agent, box]
        name:
          type: string
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    CreateTokenRequest:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [api, agent, box]
        name:
          type: string
          minLength: 1
        project_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    IssuedToken:
      type: object
      additionalProperties: false
      required: [token, credential]
      properties:
        token:
          type: string
        credential:
          $ref: "#/components/schemas/AccessToken"
    ProjectRole:
      type: string
      enum: [owner, maintainer, editor, viewer, agent, box]
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - problem_title
        - problem_summary
        - project_constraints
        - source_artifact_ids
        - created_by
        - created_at
        - updated_at
        - role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        problem_title:
          type: string
        problem_summary:
          type: string
        project_constraints:
          type: array
          items:
            type: string
        source_artifact_ids:
          type: array
          items:
            type: string
        created_by:
          type: string
          format: uuid
        archived_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          description: Time the owner moved the project to the recycle bin.
        purge_at:
          type: string
          format: date-time
          description: Time after which the project can no longer be restored.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        role:
          $ref: "#/components/schemas/ProjectRole"
    ProjectList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        problem_title:
          type: string
        problem_summary:
          type: string
        project_constraints:
          type: array
          items:
            type: string
        source_artifact_ids:
          type: array
          items:
            type: string
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        problem_title:
          type: string
        problem_summary:
          type: string
        project_constraints:
          type: array
          items:
            type: string
        source_artifact_ids:
          type: array
          items:
            type: string
        archived:
          type: boolean
          deprecated: true
          description: >
            Compatibility alias. true moves the project to the recycle bin;
            false restores it when still recoverable.
    ProjectMember:
      type: object
      additionalProperties: false
      required: [user_id, email, display_name, role, joined_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/ProjectRole"
        joined_at:
          type: string
          format: date-time
    InvitationStatus:
      type: string
      enum: [pending, accepted, revoked, declined, expired]
    ProjectInvitation:
      type: object
      additionalProperties: false
      required:
        [
          id,
          project_id,
          project_name,
          email,
          role,
          status,
          invited_by,
          expires_at,
          created_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        project_name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/ProjectRole"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        invited_by:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/ProjectRole"
          description: Human invitations accept maintainer, editor, or viewer.
    IssuedInvitation:
      type: object
      additionalProperties: false
      required: [invitation]
      properties:
        invitation:
          $ref: "#/components/schemas/ProjectInvitation"
        token:
          type: string
    InvitationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectInvitation"
    UpdateProjectMemberRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/ProjectRole"
          description: Human member updates accept owner, maintainer, editor, or viewer.
    MemberList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMember"
    ProjectPermissions:
      type: object
      additionalProperties: false
      required: [role, permissions]
      properties:
        role:
          $ref: "#/components/schemas/ProjectRole"
        permissions:
          type: array
          items:
            type: string
    ArtifactKind:
      type: string
      enum:
        [
          problem,
          attachment,
          experiment_result,
          model_file,
          article_build,
          other,
        ]
    ArtifactErrorCode:
      type: string
      enum:
        [
          ARTIFACT_NOT_FOUND,
          ARTIFACT_UPLOAD_EXPIRED,
          ARTIFACT_UPLOAD_INCOMPLETE,
          ARTIFACT_SIZE_MISMATCH,
          ARTIFACT_HASH_MISMATCH,
          ARTIFACT_TOO_LARGE,
          ARTIFACT_PART_INVALID,
          ARTIFACT_PART_MISSING,
          ARTIFACT_UPLOAD_ABORTED,
          ARTIFACT_UPLOAD_CONFLICT,
          ARTIFACT_KIND_INVALID,
          ARTIFACT_SOURCE_INVALID,
          ARTIFACT_TAG_INVALID,
          ARTIFACT_MIME_NOT_ALLOWED,
          ARTIFACT_NOT_AVAILABLE,
          ARTIFACT_PREVIEW_UNAVAILABLE,
          ARTIFACT_STORAGE_UNAVAILABLE,
          ARTIFACT_NOT_TRASHED,
          ARTIFACT_PURGE_CONFLICT,
        ]
    ArtifactPublicKind:
      type: string
      enum: [problem, attachment, other]
    ArtifactSource:
      type: string
      enum: [user_upload, experiment, model, article, system]
    ArtifactStatus:
      type: string
      enum: [pending_upload, verifying, available, failed, trashed]
    ArtifactVersionStatus:
      type: string
      enum: [pending_upload, verifying, available, failed]
    ArtifactStorageClass:
      type: string
      enum: [object, git]
    ArtifactUploadStatus:
      type: string
      enum:
        [
          initialized,
          uploading,
          completing,
          verifying,
          completed,
          aborted,
          expired,
          failed,
        ]
    ArtifactPreviewStatus:
      type: string
      enum: [queued, processing, available, unsupported, failed]
    ArtifactPreviewType:
      type: string
      enum: [image, pdf, csv, json, text, thumbnail]
    ArtifactInitializeUploadRequest:
      type: object
      additionalProperties: false
      required: [filename, size_bytes, sha256, kind, idempotency_key]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        name:
          type: string
          minLength: 1
          maxLength: 255
        size_bytes:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        mime_type:
          type: string
          minLength: 1
          maxLength: 255
        kind:
          $ref: "#/components/schemas/ArtifactPublicKind"
        tags:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        description:
          type: string
          maxLength: 4000
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
    ArtifactInitializeVersionUploadRequest:
      type: object
      additionalProperties: false
      required: [filename, size_bytes, sha256, idempotency_key]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        size_bytes:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        mime_type:
          type: string
          minLength: 1
          maxLength: 255
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
    ArtifactSignPartsRequest:
      type: object
      additionalProperties: false
      required: [part_numbers]
      properties:
        part_numbers:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 10000
    ArtifactConfirmPart:
      type: object
      additionalProperties: false
      required: [part_number, etag]
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        etag:
          type: string
          minLength: 1
          maxLength: 1024
    ArtifactConfirmUploadRequest:
      type: object
      additionalProperties: false
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: "#/components/schemas/ArtifactConfirmPart"
    ArtifactUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        kind:
          $ref: "#/components/schemas/ArtifactPublicKind"
        tags:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        description:
          type: [string, "null"]
          maxLength: 4000
    ArtifactRestoreVersionRequest:
      type: object
      additionalProperties: false
      required: [idempotency_key]
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
    ArtifactPreviewJobTransferRequest:
      type: object
      additionalProperties: false
      required: [direction, version_id]
      properties:
        direction:
          type: string
          enum: [input, output]
        version_id:
          type: string
          format: uuid
        preview_type:
          $ref: "#/components/schemas/ArtifactPreviewType"
        filename:
          type: string
          minLength: 1
          maxLength: 255
        mime_type:
          type: string
          minLength: 1
          maxLength: 255
        size_bytes:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
    ArtifactGitReference:
      type: object
      additionalProperties: false
      required: [repository_id, workspace, commit_sha, path]
      properties:
        repository_id:
          type: string
          format: uuid
        workspace:
          type: string
          const: result
        commit_sha:
          type: string
          pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
        path:
          type: string
          minLength: 1
          maxLength: 4096
    Artifact:
      type: object
      additionalProperties: false
      required:
        [
          artifact_id,
          project_id,
          kind,
          source,
          source_object_id,
          tags,
          name,
          description,
          recommended_usage,
          current_version_id,
          status,
          created_by,
          trashed_at,
          created_at,
          updated_at,
        ]
      properties:
        artifact_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ArtifactKind"
        source:
          $ref: "#/components/schemas/ArtifactSource"
        source_object_id:
          type: [string, "null"]
        tags:
          type: array
          items:
            type: string
        name:
          type: string
        description:
          type: [string, "null"]
        recommended_usage:
          type: array
          items:
            type: string
        current_version_id:
          type: [string, "null"]
          format: uuid
        status:
          $ref: "#/components/schemas/ArtifactStatus"
        created_by:
          type: string
          format: uuid
        trashed_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ArtifactVersion:
      type: object
      additionalProperties: false
      required:
        [
          version_id,
          artifact_id,
          version_no,
          storage_class,
          filename,
          sha256,
          mime_type,
          size_bytes,
          status,
          available_at,
          git_reference,
          created_by,
          created_at,
        ]
      properties:
        version_id:
          type: string
          format: uuid
        artifact_id:
          type: string
          format: uuid
        version_no:
          type: integer
          minimum: 1
        storage_class:
          $ref: "#/components/schemas/ArtifactStorageClass"
        filename:
          type: string
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        mime_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        status:
          $ref: "#/components/schemas/ArtifactVersionStatus"
        available_at:
          type: [string, "null"]
          format: date-time
        git_reference:
          oneOf:
            - $ref: "#/components/schemas/ArtifactGitReference"
            - type: "null"
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    ArtifactDetail:
      type: object
      additionalProperties: false
      required: [artifact, current_version]
      properties:
        artifact:
          $ref: "#/components/schemas/Artifact"
        current_version:
          oneOf:
            - $ref: "#/components/schemas/ArtifactVersion"
            - type: "null"
    ArtifactPage:
      type: object
      additionalProperties: false
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactDetail"
        has_more:
          type: boolean
        next_cursor:
          type: [string, "null"]
    ArtifactVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactVersion"
    ArtifactUploadPart:
      type: object
      additionalProperties: false
      required: [part_number, size_bytes, etag, completed_at]
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        size_bytes:
          type: integer
          minimum: 0
        etag:
          type: string
        completed_at:
          type: string
          format: date-time
    ArtifactUploadSession:
      type: object
      additionalProperties: false
      required:
        [
          upload_id,
          artifact_id,
          version_id,
          upload_mode,
          transfer_mode,
          status,
          size_bytes,
          sha256,
          part_size_bytes,
          part_count,
          completed_parts,
          expires_at,
          created_at,
          updated_at,
        ]
      properties:
        upload_id:
          type: string
          format: uuid
        artifact_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        upload_mode:
          type: string
          enum: [multipart, deduplicated]
        transfer_mode:
          type: string
          enum: [direct, local_proxy, none]
        status:
          $ref: "#/components/schemas/ArtifactUploadStatus"
        size_bytes:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        part_size_bytes:
          type: integer
          minimum: 1
        part_count:
          type: integer
          minimum: 0
          maximum: 10000
        completed_parts:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactUploadPart"
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ArtifactTransferGrant:
      type: object
      additionalProperties: false
      required: [method, url, headers, expires_at]
      properties:
        method:
          type: string
          enum: [GET, PUT]
        url:
          type: string
          format: uri-reference
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
    ArtifactPartGrant:
      type: object
      additionalProperties: false
      required: [part_number, size_bytes, transfer]
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        size_bytes:
          type: integer
          minimum: 0
        transfer:
          $ref: "#/components/schemas/ArtifactTransferGrant"
    ArtifactPartGrantList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ArtifactPartGrant"
    ArtifactDownloadGrant:
      type: object
      additionalProperties: false
