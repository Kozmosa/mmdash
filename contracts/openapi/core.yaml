          type: string
          format: uri
          maxLength: 2048
        dashboard_session_token:
          type: string
          minLength: 16
          maxLength: 4096
          writeOnly: true
        cloudflare_access_client_id:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
        cloudflare_access_client_secret:
          type: string
          minLength: 16
          maxLength: 4096
          writeOnly: true
        allowed_tools:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AgentToolName"
          example:
            [
              project.get,
              data.list,
              data.read,
              context.promote,
              progress.get,
              progress.recalculate,
              artifact.upload,
              artifact.read,
            ]
          description: >-
            Exact reviewed MCP Tool names; product Agent grants do not
            accept wildcards or tools outside the closed Agent scope.
    OneTimeAgentToken:
      type: object
      additionalProperties: false
      required: [token, credential, mcp_endpoint]
      properties:
        token:
          type: string
          minLength: 32
          readOnly: true
          description: Opaque Agent Token returned exactly once in manual mode.
        credential:
          $ref: "#/components/schemas/AgentCredential"
        mcp_endpoint:
          type: string
          format: uri
          description: >-
            MCP endpoint containing the pending credential's one-time
            verification challenge. The challenge is consumed by the first
            successful negotiated tools/list and has no authority afterward.
        server_name:
          type: string
          description: Recommended Hermes MCP server name.
    AgentInstanceProvisioningResult:
      type: object
      additionalProperties: false
      required: [instance]
      properties:
        instance:
          $ref: "#/components/schemas/AgentInstance"
        one_time_credential:
          $ref: "#/components/schemas/OneTimeAgentToken"
          description: Present only for manual provisioning; auto mode never returns Agent Token plaintext to the browser.
    RunAgentChecksRequest:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope:
          type: string
          enum: [runtime, management, project_access, all]
    AgentChecksResult:
      type: object
      additionalProperties: false
      required: [status, checked_at, checks, instance]
      properties:
        status:
          type: string
          enum: [passed, failed, partial]
        checked_at: { type: string, format: date-time }
        checks:
          type: array
          items:
            $ref: "#/components/schemas/AgentCheck"
        instance:
          $ref: "#/components/schemas/AgentInstance"
    AgentProjectAccessVerificationResult:
      type: object
      additionalProperties: false
      required: [verified, checked_at, check, instance]
      properties:
        verified: { type: boolean }
        checked_at: { type: string, format: date-time }
        check:
          $ref: "#/components/schemas/AgentCheck"
        instance:
          $ref: "#/components/schemas/AgentInstance"
    RotateAgentTokenRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        expires_at:
          type: string
          format: date-time
    AgentTokenRotationResult:
      type: object
      additionalProperties: false
      required: [credential, rotation_status, old_credential_remains_active]
      properties:
        credential:
          $ref: "#/components/schemas/AgentCredential"
        rotation_status:
          type: string
          enum:
            [
              awaiting_user,
              configuring,
              verifying,
              completed,
              failed,
              cancelled,
            ]
        old_credential_remains_active:
          type: boolean
        one_time_credential:
          $ref: "#/components/schemas/OneTimeAgentToken"
          description: Present only for manual rotation; auto mode never returns plaintext.
        safe_error_code:
          type: string
          maxLength: 100
    AgentTokenVerificationResult:
      type: object
      additionalProperties: false
      required: [verified, credential, old_credential_revoked, instance]
      properties:
        verified: { type: boolean }
        credential:
          $ref: "#/components/schemas/AgentCredential"
        old_credential_revoked: { type: boolean }
        instance:
          $ref: "#/components/schemas/AgentInstance"
    AgentTokenAbortResult:
      type: object
      additionalProperties: false
      required: [credential, old_credential_remains_active]
      properties:
        credential:
          $ref: "#/components/schemas/AgentCredential"
        old_credential_remains_active: { type: boolean }
    AgentPrompt:
      type: object
      additionalProperties: false
      required:
        [
          agent_instance_id,
          project_id,
          default_prompt,
          effective_prompt,
          custom,
          version,
        ]
      properties:
        agent_instance_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        default_prompt: { type: string }
        effective_prompt: { type: string }
        custom_prompt: { type: string }
        custom: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
        updated_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
    UpdateAgentPromptRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 50000
    AgentSession:
      type: object
      additionalProperties: false
      required:
        - session_id
        - agent_instance_id
        - project_id
        - remote_session_id
        - session_type
        - title
        - status
        - default
        - version
        - created_at
        - updated_at
      properties:
        session_id: { type: string, format: uuid }
        agent_instance_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        remote_session_id: { type: string }
        session_type:
          $ref: "#/components/schemas/AgentSessionType"
        title: { type: string }
        status:
          $ref: "#/components/schemas/AgentSessionStatus"
        default: { type: boolean }
        parent_session_id: { type: string, format: uuid }
        end_reason: { type: string }
        last_run_id: { type: string, format: uuid }
        last_message_at: { type: string, format: date-time }
        last_run_at: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
    AgentSessionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentSession"
    CreateAgentSessionRequest:
      type: object
      additionalProperties: false
      required: [title, session_type]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        session_type:
          type: string
          const: main
          description: Human-created Agent conversations are always main Sessions.
        default: { type: boolean }
    UpdateAgentSessionRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
    EndAgentSessionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
    ForkAgentSessionRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        default: { type: boolean }
    AgentToolCall:
      type: object
      additionalProperties: false
      required: [tool_call_id, name, status]
      properties:
        tool_call_id: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [queued, running, completed, failed]
        input_summary:
          type: string
          maxLength: 4000
        output_summary:
          type: string
          maxLength: 10000
        safe_error_code:
          type: string
          maxLength: 100
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    AgentMessage:
      type: object
      additionalProperties: false
      required: [message_id, role, content]
      properties:
        message_id: { type: string }
        role:
          type: string
          enum: [user, assistant, tool, system]
        content: { type: string }
        tool_call_id: { type: string }
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/AgentToolCall"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AgentChatAttachment"
        created_at: { type: string, format: date-time }
    AgentChatAttachment:
      type: object
      additionalProperties: false
      required:
        - artifact_id
        - version_id
        - run_id
        - direction
        - name
        - filename
        - mime_type
        - size_bytes
        - created_at
      properties:
        artifact_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        direction: { type: string, enum: [input, output] }
        name: { type: string }
        filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
    AgentMessageList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentMessage"
    AgentUsage:
      type: object
      additionalProperties: false
      properties:
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
    AgentRun:
      type: object
      additionalProperties: false
      required:
        - run_id
        - session_id
        - remote_run_id
        - status
        - source
        - tool_calls
        - version
        - created_at
        - updated_at
      properties:
        run_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        remote_run_id: { type: string }
        status:
          $ref: "#/components/schemas/AgentRunStatus"
        source:
          $ref: "#/components/schemas/AgentRunSource"
        source_run_id: { type: string, format: uuid }
        source_evaluation_id: { type: string, format: uuid }
        safe_error_code: { type: string, maxLength: 100 }
        safe_error_message: { type: string, maxLength: 1000 }
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/AgentToolCall"
        usage:
          $ref: "#/components/schemas/AgentUsage"
        version: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AgentRunLaunch:
      type: object
      additionalProperties: false
      required: [session, run]
      properties:
        session:
          $ref: "#/components/schemas/AgentSession"
        run:
          $ref: "#/components/schemas/AgentRun"
    StartAgentRunRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 100000
        artifact_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }
        reasoning_effort:
          type: string
          description: Request-scoped Hermes reasoning intensity. Omit to use the runtime default.
          enum: [none, minimal, low, medium, high, xhigh, max, ultra]
    ReplayAgentRunRequest:
      type: object
      additionalProperties: false
      properties:
        message_id:
          type: string
          minLength: 1
          maxLength: 500
    AgentApprovalChoice:
      type: string
      enum: [once, session, always, deny]
    RespondAgentRunApprovalRequest:
      type: object
      additionalProperties: false
      required: [choice]
      properties:
        choice:
          $ref: "#/components/schemas/AgentApprovalChoice"
    AgentApproval:
      type: object
      additionalProperties: false
      required: [approval_id, choices]
      properties:
        approval_id: { type: string }
        choices:
          type: array
          items:
            $ref: "#/components/schemas/AgentApprovalChoice"
    AgentStreamEventType:
      type: string
      enum:
        - run.started
        - run.status
        - message.started
        - message.delta
        - message.completed
        - reasoning.available
        - tool.progress
        - tool.started
        - tool.completed
        - tool.failed
        - approval.required
        - approval.responded
        - subagent.started
        - subagent.completed
        - run.completed
        - run.failed
        - run.stopped
        - heartbeat
        - done
        - error
    AgentStreamEvent:
      type: object
      additionalProperties: false
      required: [event, event_id, sequence, occurred_at, run_id, session_id]
      properties:
        event:
          $ref: "#/components/schemas/AgentStreamEventType"
        event_id: { type: string }
        sequence: { type: integer, format: int64, minimum: 1 }
        occurred_at: { type: string, format: date-time }
        run_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        message_id: { type: string }
        delta: { type: string }
        tool_call:
          $ref: "#/components/schemas/AgentToolCall"
        run:
          $ref: "#/components/schemas/AgentRun"
        approval:
          $ref: "#/components/schemas/AgentApproval"
        safe_error_code: { type: string, maxLength: 100 }
        safe_error_message: { type: string, maxLength: 1000 }
    Liveness:
      type: object
      additionalProperties: false
      required: [service, status, version]
      properties:
        service:
          type: string
          const: core
        status:
          type: string
          const: ok
        version:
          type: string
    Readiness:
      type: object
      additionalProperties: false
      required: [dependencies, status]
      properties:
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [ready, unavailable]
          required: [postgres, object_storage]
        status:
          type: string
          enum: [ready, not_ready]
    ExampleCheck:
      type: object
      additionalProperties: false
      required: [status, storage, checked_at]
      properties:
        status:
          type: string
          const: ok
        storage:
          type: string
          const: postgres
        checked_at:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          description: Optional operation-specific structured details.
security:
  - bearerAuth: []
