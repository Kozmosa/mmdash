      summary: Explicitly replay an event to one or all matching consumers
      operationId: events.replay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayEventRequest"
      responses:
        "202":
          description: Replay deliveries created with a fresh idempotency key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventReplay"
        "404":
          $ref: "#/components/responses/Error"
  /v1/data/projects/{projectId}/objects:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Data Hub]
      summary: List project objects
      description: Stable `data.list` routing entry point for users and Agents.
      operationId: data.list
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Cursor-paginated object projections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataObjectPage"
        "403":
          $ref: "#/components/responses/Error"
  /v1/data/projects/{projectId}/objects/{objectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: objectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Data Hub]
      summary: Read one project object through its domain adapter
      description: Stable `data.read` routing entry point; full content remains domain-owned.
      operationId: data.read
      responses:
        "200":
          description: Registry projection plus authoritative module content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataObjectRead"
        "404":
          $ref: "#/components/responses/Error"
  /v1/data/projects/{projectId}/activity:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Data Hub]
      summary: List the project activity timeline
      operationId: data.activity.list
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Cursor-paginated activity projections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataActivityPage"
  /v1/data/projects/{projectId}/context:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Data Hub]
      summary: List human-confirmed project context
      operationId: data.context.list
      responses:
        "200":
          description: Formal project context only; pending proposals are excluded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectContextList"
  /v1/data/projects/{projectId}/context/proposals:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Data Hub]
      summary: List context proposals
      operationId: data.context.proposals.list
      responses:
        "200":
          description: Context proposals visible to collaborators who may propose.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextProposalList"
    post:
      tags: [Data Hub]
      summary: Propose information for formal project context
      description: Agents may create proposals but cannot confirm them.
      operationId: data.context.proposals.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContextProposalRequest"
      responses:
        "201":
          description: Pending context proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextProposal"
  /v1/data/projects/{projectId}/context/proposals/{proposalId}/review:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: proposalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Data Hub]
      summary: Accept or reject a context proposal
      description: Requires a human browser session and context-review permission.
      operationId: data.context.proposals.review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewContextProposalRequest"
      responses:
        "200":
          description: Reviewed proposal; acceptance also creates formal context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextProposal"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/data/projects/{projectId}/home:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Data Hub]
      summary: Read the project-home aggregate DTO shell
      operationId: data.home.get
      responses:
        "200":
          description: Typed empty sections ready for future domain contributors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeAggregate"
  /v1/projects/{projectId}/agent-instances:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Agent]
      summary: List Agent instances granted to a project
      operationId: agent.instances.list
      responses:
        "200":
          description: Agent instances with redacted configuration state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentInstanceList"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [Agent]
      summary: Create and bind an Agent instance
      description: |
        Creates a Hermes-backed instance and Project Grant. Manual mode may
        return one Agent Token plaintext exactly once; auto mode never returns
        Agent Token plaintext to the browser.
      operationId: agent.instances.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentInstanceRequest"
      responses:
        "201":
          description: Instance created or auto provisioning completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentInstanceProvisioningResult"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/agent-instances/{agentInstanceId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AgentInstanceId"
    get:
      tags: [Agent]
      summary: Get an Agent instance
      operationId: agent.instances.get
      responses:
        "200":
          description: Agent instance without credential plaintext.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentInstance"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Agent]
      summary: Update Agent runtime or management configuration
      description: |
        Ordinary configuration changes return only the updated instance.
        Changing allowed_tools starts a two-phase Agent Token rotation: the old
        Token remains active until the new scope is verified; manual mode may
        return the new Token once, while auto mode never returns plaintext.
      operationId: agent.instances.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentInstanceRequest"
      responses:
        "200":
          description: Updated instance and, only when required in manual mode, one-time rotation material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentInstanceProvisioningResult"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Agent]
      summary: Remove an Agent instance and revoke Project access
      description: |
        Revokes every credential and removes the instance from the workspace.
        Referential records and Hermes message history remain available to
        Audit and retention processing. Repeating removal for a previously
        disabled visible instance is supported.
      operationId: agent.instances.disable
      responses:
        "204":
          description: Instance removed from the workspace and credentials revoked.
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/agent-instances/{agentInstanceId}/checks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AgentInstanceId"
    post:
      tags: [Agent]
      summary: Run bounded Agent runtime and management checks
      operationId: agent.instances.check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunAgentChecksRequest"
      responses:
        "200":
          description: Independent runtime, management, and project-access results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentChecksResult"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/agent-instances/{agentInstanceId}/project-access/verify:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AgentInstanceId"
    post:
      tags: [Agent]
      summary: Verify Hermes can reach the scoped mmdash MCP endpoint
      description: >
        Verification is distinct from runtime and Dashboard connectivity. In
        auto mode the Adapter exercises the reverse connection through the
        managed Dashboard API. In manual mode mmdash cannot drive Hermes, so
        verification passes only when MCP Gateway has recorded a real
        credential-owned tools/list evidence callback for an active Agent
        Token; until then the endpoint returns verified=false with check code
        gateway_verification_missing and the instance stays setup_pending.
      operationId: agent.project_access.verify
      responses:
        "200":
          description: Actual reverse-connection verification result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProjectAccessVerificationResult"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/agent-instances/{agentInstanceId}/tokens/rotate:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AgentInstanceId"
    post:
      tags: [Agent]
      summary: Begin a two-phase Agent Token rotation
      description: The old active Token remains valid until the new pending Token is verified and activated.
      operationId: agent.tokens.rotate
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateAgentTokenRequest"
      responses:
        "201":
          description: Rotation created; manual mode may return the new Token once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTokenRotationResult"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/agent-instances/{agentInstanceId}/tokens/{tokenId}/verify:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AgentInstanceId"
      - $ref: "#/components/parameters/AgentTokenId"
    post:
      tags: [Agent]
      summary: Verify and activate a pending Agent Token
      description: Revokes the previous Token only after a real MCP access using the pending Token succeeds.
      operationId: agent.tokens.verify
      responses:
        "200":
          description: Pending Token activated and previous Token safely revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTokenVerificationResult"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/agent-instances/{agentInstanceId}/tokens/{tokenId}/abort:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AgentInstanceId"
      - $ref: "#/components/parameters/AgentTokenId"
    post:
      tags: [Agent]
      summary: Abort a pending Agent Token rotation
      operationId: agent.tokens.abort
      responses:
        "200":
          description: Pending Token revoked while the old Token remains active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTokenAbortResult"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/agent-instances/{agentInstanceId}/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AgentInstanceId"
      - $ref: "#/components/parameters/AgentTokenId"
    delete:
      tags: [Agent]
      summary: Immediately revoke an Agent Token
      operationId: agent.tokens.revoke
      responses:
        "204":
          description: Token revoked; Hermes can no longer use it to access mmdash.
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/agent-instances/{agentInstanceId}/prompt:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AgentInstanceId"
    get:
      tags: [Agent]
      summary: Get the generated and effective project Agent prompt
      operationId: agent.prompt.get
      responses:
        "200":
          description: Default, custom, and effective prompt state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPrompt"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Agent]
      summary: Set a project-specific Agent prompt override
      operationId: agent.prompt.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentPromptRequest"
      responses:
        "200":
          description: Updated effective prompt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPrompt"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/agent-instances/{agentInstanceId}/prompt/reset:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AgentInstanceId"
    post:
      tags: [Agent]
      summary: Restore the generated default project Agent prompt
      operationId: agent.prompt.reset
      responses:
        "200":
          description: Custom override removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPrompt"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/agent-instances/{agentInstanceId}/sessions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AgentInstanceId"
    get:
      tags: [Agent]
      summary: List indexed Agent sessions
      operationId: agent.sessions.list
      responses:
        "200":
          description: Local indexes mapped to Hermes remote Session IDs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionList"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [Agent]
      summary: Create a main, progress, or experiment Agent session
      description: Stage 5 does not attach automatic triggers to progress sessions.
      operationId: agent.sessions.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentSessionRequest"
      responses:
        "201":
          description: Local and remote Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/agent-instances/{agentInstanceId}/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AgentInstanceId"
      - $ref: "#/components/parameters/AgentSessionId"
    get:
      tags: [Agent]
      summary: Get an indexed Agent session
      operationId: agent.sessions.get
      responses:
        "200":
          description: Agent Session index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Agent]
      summary: Rename an Agent session
      operationId: agent.sessions.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentSessionRequest"
      responses:
        "200":
          description: Local and remote title updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/agent-instances/{agentInstanceId}/sessions/{sessionId}/end:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AgentInstanceId"
      - $ref: "#/components/parameters/AgentSessionId"
    post:
      tags: [Agent]
      summary: End an Agent session without deleting history
      operationId: agent.sessions.end
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndAgentSessionRequest"
      responses:
        "200":
          description: Session ended in mmdash and Hermes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/agent-instances/{agentInstanceId}/sessions/{sessionId}/continue:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AgentInstanceId"
      - $ref: "#/components/parameters/AgentSessionId"
    post:
      tags: [Agent]
      summary: Continue an ended Agent session
      operationId: agent.sessions.continue
      responses:
        "200":
          description: Session is active and ready for another Run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/agent-instances/{agentInstanceId}/sessions/{sessionId}/fork:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/AgentInstanceId"
      - $ref: "#/components/parameters/AgentSessionId"
    post:
      tags: [Agent]
      summary: Fork an Agent session and preserve lineage
      operationId: agent.sessions.fork
