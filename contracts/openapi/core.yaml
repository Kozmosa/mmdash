      operationId: jobs.complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteJobRequest"
      responses:
        "200":
          description: Terminal job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /v1/jobs/{jobId}/fail:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [Jobs]
      summary: Submit a handler failure
