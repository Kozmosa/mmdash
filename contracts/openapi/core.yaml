          minLength: 1
        fields:
          type: object
          additionalProperties: true
    CompleteJobRequest:
      type: object
      additionalProperties: false
      required: [worker_id, result]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 200
        result:
          type: object
          additionalProperties: true
    FailJobRequest:
      type: object
