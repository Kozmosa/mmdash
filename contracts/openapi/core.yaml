            $ref: "#/components/schemas/EventDelivery"
        failures:
          type: array
          items:
            $ref: "#/components/schemas/EventFailure"
        replays:
          type: array
          items:
            $ref: "#/components/schemas/EventReplay"
    EventFailure:
      type: object
      additionalProperties: false
      required:
        - id
        - delivery_id
        - event_id
        - consumer_name
        - delivery_key
        - attempt
        - error_message
        - failed_at
      properties:
        id:
          type: string
          format: uuid
        delivery_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        consumer_name:
          type: string
        delivery_key:
          type: string
        attempt:
          type: integer
          minimum: 1
        error_message:
          type: string
        failed_at:
          type: string
          format: date-time
    Liveness:
      type: object
      additionalProperties: false
      required: [service, status, version]
      properties:
