openapi: 3.1.0
info:
  title: mmdash Core API
  version: 0.1.0
  description: |
    Stable HTTP contract exposed by the Go Core Server. Browser clients use it
    through Web BFF, and Agent clients use it through MCP Gateway.
servers:
  - url: http://localhost:8080
    description: Local Core Server
tags:
  - name: Health
    description: Process liveness and dependency readiness.
  - name: System
    description: Core platform metadata.
  - name: Engineering
    description: Non-domain endpoints used to verify the technical baseline.
  - name: Auth
    description: Users, sessions, and revocable access credentials.
  - name: Projects
    description: Collaborative projects, membership, roles, and permissions.
  - name: Settings
    description: Typed system/project configuration, redacted secrets, and connection tests.
  - name: Jobs
    description: Durable asynchronous jobs and the authenticated Worker protocol.
  - name: Events
    description: Outbox inspection, registered consumers, and explicit replay.
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Check whether the Core process is alive
      operationId: health.live
      security: []
      responses:
        "200":
          description: The Core process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /health/ready:
    get:
      tags: [Health]
      summary: Check Core dependency readiness
      operationId: health.ready
      security: []
      responses:
        "200":
          description: PostgreSQL and object storage are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: One or more dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /openapi.yaml:
    get:
      tags: [System]
      summary: Read the running Core OpenAPI contract
      operationId: system.openapi.get
      security: []
      responses:
        "200":
          description: The canonical Core OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
  /v1/example:
    get:
      tags: [Engineering]
      summary: Verify the example module and PostgreSQL path
      operationId: example.check
      security: []
      responses:
        "200":
          description: PostgreSQL is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleCheck"
        "503":
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      operationId: auth.login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: A revocable browser session was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current browser session
      operationId: auth.logout
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Resolve the current identity
      operationId: auth.me
      responses:
        "200":
          description: Current authenticated identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/tokens:
    get:
      tags: [Auth]
      summary: List token metadata owned by the current user
      operationId: auth.tokens.list
      responses:
        "200":
          description: Token metadata without secrets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccessToken"
    post:
      tags: [Auth]
      summary: Issue an API, Agent, or Box token
      operationId: auth.tokens.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token secret returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedToken"
  /v1/auth/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [Auth]
      summary: Revoke an access token
      operationId: auth.tokens.revoke
      responses:
        "204":
          description: Token revoked.
        "404":
          $ref: "#/components/responses/Error"
  /v1/projects:
    get:
      tags: [Projects]
      summary: List projects visible to the current identity
      operationId: projects.list
      parameters:
        - name: include_archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Visible collaborative projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
    post:
      tags: [Projects]
      summary: Create a collaborative project
      operationId: projects.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created with the caller as owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Get a project
      operationId: projects.get
      responses:
        "200":
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Projects]
      summary: Update or archive a project
      operationId: projects.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /v1/projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: List project collaborators
      operationId: projects.members.list
      responses:
        "200":
          description: Project team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
  /v1/projects/{projectId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [Projects]
      summary: Add a collaborator or change their role
      operationId: projects.members.upsert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectMemberRequest"
      responses:
        "200":
          description: Updated collaborator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
    delete:
      tags: [Projects]
      summary: Remove a collaborator
      operationId: projects.members.remove
      responses:
        "204":
          description: Collaborator removed.
        "409":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/permissions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Get the current identity's effective project permissions
      operationId: projects.permissions.get
      responses:
        "200":
          description: Effective role and permission names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPermissions"
  /v1/settings/types:
    get:
      tags: [Settings]
      summary: List registered configuration types for a scope
      operationId: settings.types.list
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/SettingScope"
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Module-owned configuration type descriptors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingTypeList"
        "403":
          $ref: "#/components/responses/Error"
  /v1/settings/system/{typeKey}:
    parameters:
      - $ref: "#/components/parameters/TypeKey"
    get:
      tags: [Settings]
      summary: Read a redacted system setting
      operationId: settings.system.get
      responses:
        "200":
          description: Redacted system setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Settings]
      summary: Update a system setting
      operationId: settings.system.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingRequest"
      responses:
        "200":
          description: Updated redacted setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
    delete:
      tags: [Settings]
      summary: Delete a system setting
      operationId: settings.system.delete
      responses:
        "204":
          description: Setting deleted.
  /v1/settings/system/{typeKey}/test:
    parameters:
      - $ref: "#/components/parameters/TypeKey"
    post:
      tags: [Settings]
      summary: Test a saved system configuration
      operationId: settings.system.test
      responses:
        "200":
          description: Safe per-check connection-test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"
  /v1/settings/projects/{projectId}/{typeKey}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TypeKey"
    get:
      tags: [Settings]
      summary: Read a redacted project setting
      operationId: settings.projects.get
      responses:
        "200":
          description: Redacted project setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Settings]
      summary: Update a project setting
      operationId: settings.projects.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingRequest"
      responses:
        "200":
          description: Updated redacted setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
    delete:
      tags: [Settings]
      summary: Delete a project setting
      operationId: settings.projects.delete
      responses:
        "204":
          description: Setting deleted.
  /v1/settings/projects/{projectId}/{typeKey}/test:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TypeKey"
    post:
      tags: [Settings]
      summary: Test a saved project configuration
      operationId: settings.projects.test
      responses:
        "200":
          description: Safe per-check connection-test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"
  /v1/jobs:
    post:
      tags: [Jobs]
      summary: Create an idempotent project job
      operationId: jobs.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "200":
          description: Existing job returned for the same idempotency key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "201":
          description: Job created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /v1/jobs/claim:
    post:
      tags: [Jobs]
      summary: Atomically claim the next eligible job
      description: "Requires an API token. Returns `job: null` when no job is available."
      operationId: jobs.claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimJobRequest"
      responses:
        "200":
          description: Claimed job or an empty poll result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobClaim"
  /v1/jobs/workers/heartbeat:
    post:
      tags: [Jobs]
      summary: Record Worker process liveness and capabilities
      description: Requires an API token.
      operationId: jobs.workers.heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHeartbeatRequest"
      responses:
        "204":
          description: Heartbeat recorded.
  /v1/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [Jobs]
      summary: Read a project job
      operationId: jobs.get
      responses:
        "200":
          description: Authoritative job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Error"
  /v1/jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [Jobs]
      summary: Cancel queued work or signal a running Worker
      operationId: jobs.cancel
      responses:
        "200":
          description: Updated job state or cancellation signal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /v1/jobs/{jobId}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [Jobs]
      summary: Renew a Worker-owned job lease
      description: Requires an API token and returns any cancellation signal.
      operationId: jobs.lease.renew
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewJobLeaseRequest"
      responses:
        "200":
          description: Renewed lease and current job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "409":
          $ref: "#/components/responses/Error"
  /v1/jobs/{jobId}/logs:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [Jobs]
      summary: Read append-only job logs
      operationId: jobs.logs.list
      responses:
        "200":
          description: Ordered job log entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLogList"
    post:
      tags: [Jobs]
      summary: Append a log under an active Worker lease
      description: Requires an API token.
      operationId: jobs.logs.append
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendJobLogRequest"
      responses:
        "201":
          description: Log appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLog"
  /v1/jobs/{jobId}/complete:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [Jobs]
      summary: Submit a successful job result
      description: Requires an API token and an active Worker lease.
      operationId: jobs.complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteJobRequest"
      responses:
        "200":
          description: Terminal job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /v1/jobs/{jobId}/fail:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [Jobs]
      summary: Submit a handler failure
      description: Core applies retry, cancellation, timeout, and max-attempt policy.
      operationId: jobs.fail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailJobRequest"
      responses:
        "200":
          description: Retried or terminal job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /v1/events/test:
    post:
      tags: [Events]
      summary: Enqueue an engineering test event
      description: System administrator endpoint used by foundation smoke checks.
      operationId: events.test.emit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmitTestEventRequest"
      responses:
        "201":
          description: Test event committed to system_outbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventEnqueued"
        "403":
          $ref: "#/components/responses/Error"
  /v1/events/consumers:
    get:
      tags: [Events]
      summary: List registered in-process event consumers
      operationId: events.consumers.list
      responses:
        "200":
          description: Deterministic consumer registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventConsumerList"
  /v1/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      summary: Inspect Outbox publication and consumer delivery state
      operationId: events.get
      responses:
        "200":
          description: Event envelope and all live/replay deliveries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxEventState"
        "404":
          $ref: "#/components/responses/Error"
  /v1/events/{eventId}/replay:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      tags: [Events]
      summary: Explicitly replay an event to one or all matching consumers
      operationId: events.replay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayEventRequest"
      responses:
        "202":
          description: Replay deliveries created with a fresh idempotency key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventReplay"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or opaque token
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TypeKey:
      name: typeKey
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_.-]*$"
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Stable Core error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    User:
      type: object
      additionalProperties: false
      required: [id, email, display_name, status, system_role, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        system_role:
          type: string
          enum: [admin, member]
        created_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    LoginResult:
      type: object
      additionalProperties: false
      required: [access_token, expires_at, session_id, user]
      properties:
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        session_id:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
    Identity:
      type: object
      additionalProperties: false
      required: [kind, user]
      properties:
        kind:
          type: string
          enum: [session, api, agent, box]
        project_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        token_id:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
    AccessToken:
      type: object
      additionalProperties: false
      required: [id, user_id, kind, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [api, agent, box]
        name:
          type: string
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    CreateTokenRequest:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [api, agent, box]
        name:
          type: string
          minLength: 1
        project_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    IssuedToken:
      type: object
      additionalProperties: false
      required: [token, credential]
      properties:
        token:
          type: string
        credential:
          $ref: "#/components/schemas/AccessToken"
    ProjectRole:
      type: string
      enum: [owner, maintainer, editor, viewer, agent, box]
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - problem_title
        - problem_summary
        - project_constraints
        - source_artifact_ids
        - created_by
        - created_at
        - updated_at
        - role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        problem_title:
          type: string
        problem_summary:
          type: string
        project_constraints:
          type: array
          items:
            type: string
        source_artifact_ids:
          type: array
          items:
            type: string
        created_by:
          type: string
          format: uuid
        archived_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        role:
          $ref: "#/components/schemas/ProjectRole"
    ProjectList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        problem_title:
          type: string
        problem_summary:
          type: string
        project_constraints:
          type: array
          items:
            type: string
        source_artifact_ids:
          type: array
          items:
            type: string
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        problem_title:
          type: string
        problem_summary:
          type: string
        project_constraints:
          type: array
          items:
            type: string
        source_artifact_ids:
          type: array
          items:
            type: string
        archived:
          type: boolean
    ProjectMember:
      type: object
      additionalProperties: false
      required: [user_id, email, display_name, role, joined_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/ProjectRole"
        joined_at:
          type: string
          format: date-time
    UpdateProjectMemberRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/ProjectRole"
    MemberList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
