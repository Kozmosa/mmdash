    parameters:
      - { $ref: "#/components/parameters/BoxId" }
      - { $ref: "#/components/parameters/BoxTaskId" }
    post:
      tags: [Box]
      summary: Report a monotonic Box task status transition
      operationId: box.tasks.status
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BoxTaskStatusRequest" }
      responses:
        "200":
          description: Updated Experiment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
