      properties:
        decision: { type: string, enum: [accepted, rejected] }
        note: { type: string, maxLength: 4000 }
    ProgressSettings:
      type: object
      additionalProperties: false
      required: [project_id, auto_task_changes, updated_by, updated_at]
      properties:
        project_id: { type: string, format: uuid }
        auto_task_changes: { type: boolean }
        updated_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
    UpdateProgressSettingsRequest:
      type: object
      additionalProperties: false
      required: [auto_task_changes]
      properties:
        auto_task_changes: { type: boolean }
    Notification:
      type: object
      additionalProperties: false
      required:
        [
          notification_id,
          type_key,
          template_version,
          source_event_id,
          priority,
          data,
          occurred_at,
          created_at,
        ]
      properties:
        notification_id: { type: string, format: uuid }
        type_key: { type: string }
        template_version: { type: integer, minimum: 1 }
        source_event_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        resource_type: { type: string }
        resource_id: { type: string }
        priority: { type: string, enum: [low, normal, high, urgent] }
        data: { type: object, additionalProperties: true }
        rendered_snapshot: { type: object, additionalProperties: true }
        action: { $ref: "#/components/schemas/NotificationAction" }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    NotificationAction:
      type: object
      additionalProperties: false
      required: [action_type, action_resource_id]
      properties:
        action_type: { type: string }
        action_resource_id: { type: string }
        route: { type: string }
    NotificationRecipient:
      type: object
      additionalProperties: false
      required: [recipient_id, notification_id, recipient_key]
      properties:
        recipient_id: { type: string, format: uuid }
        notification_id: { type: string, format: uuid }
        recipient_key: { type: string }
        user_id: { type: string, format: uuid }
        normalized_email: { type: string, format: email }
        expires_at: { type: string, format: date-time }
    InboxItem:
      type: object
      additionalProperties: false
      required:
        [
          inbox_item_id,
          notification,
          recipient,
          read_state,
          outcome,
          created_at,
          updated_at,
        ]
      properties:
        inbox_item_id: { type: string, format: uuid }
        notification: { $ref: "#/components/schemas/Notification" }
        recipient: { $ref: "#/components/schemas/NotificationRecipient" }
        read_state: { type: string, enum: [read, unread] }
        archived_at: { type: string, format: date-time }
        outcome: { type: string, enum: [active, resolved, revoked, expired] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InboxPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          { type: array, items: { $ref: "#/components/schemas/InboxItem" } }
        next_cursor: { type: string }
        has_more: { type: boolean }
    UnreadCount:
      type: object
      additionalProperties: false
      required: [count]
      properties: { count: { type: integer, minimum: 0 } }
    UpdateInboxRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        read_state: { type: string, enum: [read, unread] }
        archived: { type: boolean }
    MarkAllInboxReadRequest:
      type: object
      additionalProperties: false
      properties:
        project_id: { type: string, format: uuid }
        type_key: { type: string }
    NotificationChannel:
      type: object
      additionalProperties: false
      required: [channel_key, enabled, configured, settings_version]
      properties:
        channel_key: { type: string }
        enabled: { type: boolean }
        configured: { type: boolean }
        settings_version: { type: integer, minimum: 0 }
    UpdateNotificationChannelRequest:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values: { type: object, additionalProperties: true }
    NotificationRule:
      type: object
      additionalProperties: false
      required:
        [
          project_id,
          type_key,
          external_enabled,
          channel_keys,
          minimum_priority,
          version,
        ]
      properties:
        project_id: { type: string, format: uuid }
        type_key: { type: string }
        external_enabled: { type: boolean }
        channel_keys:
          type: array
          items:
            type: string
            enum: [notification.feishu_webhook, notification.generic_webhook]
        minimum_priority: { type: string, enum: [low, normal, high, urgent] }
        version: { type: integer, minimum: 0 }
        updated_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
    UpdateNotificationRuleRequest:
      type: object
      additionalProperties: false
      required: [external_enabled, version]
      properties:
        external_enabled: { type: boolean }
        channel_keys:
          type: array
          items:
            type: string
            enum: [notification.feishu_webhook, notification.generic_webhook]
        minimum_priority: { type: string, enum: [low, normal, high, urgent] }
        version: { type: integer, minimum: 0 }
    NotificationDelivery:
      type: object
      additionalProperties: false
      required:
        [
          delivery_id,
          notification_id,
          project_id,
          channel_key,
          target_key,
          rule_version,
          settings_version,
          delivery_key,
          status,
          attempts,
          max_attempts,
          available_at,
          created_at,
          updated_at,
        ]
      properties:
        delivery_id: { type: string, format: uuid }
        notification_id: { type: string, format: uuid }
        recipient_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        channel_key: { type: string }
        target_key: { type: string }
        rule_version: { type: integer, minimum: 0 }
        settings_version: { type: integer, minimum: 0 }
        delivery_key: { type: string }
        status:
          {
            type: string,
            enum: [pending, sending, delivered, retrying, failed, cancelled],
          }
        attempts: { type: integer, minimum: 0 }
        max_attempts: { type: integer, minimum: 1 }
        provider_message_id: { type: string }
        last_error_code: { type: string }
        last_error: { type: string }
        response_summary: { type: string }
        available_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NotificationDeliveryPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          {
            type: array,
            items: { $ref: "#/components/schemas/NotificationDelivery" },
          }
        next_cursor: { type: string }
        has_more: { type: boolean }
    RetryNotificationDeliveryRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties: { reason: { type: string, minLength: 1, maxLength: 1000 } }
    Liveness:
      type: object
      additionalProperties: false
      required: [service, status, version]
      properties:
        service:
          type: string
          const: core
        status:
          type: string
          const: ok
        version:
          type: string
    Readiness:
      type: object
      additionalProperties: false
      required: [dependencies, status]
      properties:
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [ready, unavailable]
          required: [postgres, object_storage]
        status:
          type: string
          enum: [ready, not_ready]
    ExampleCheck:
      type: object
      additionalProperties: false
      required: [status, storage, checked_at]
      properties:
        status:
          type: string
          const: ok
        storage:
          type: string
          const: postgres
        checked_at:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          description: Optional operation-specific structured details.
security:
  - bearerAuth: []
