openapi: 3.1.0
info:
  title: mmdash Core API
  version: 0.1.0
  description: |
    Stable HTTP contract exposed by the Go Core Server. Browser clients use it
    through Web BFF, and Agent clients use it through MCP Gateway.
servers:
  - url: http://localhost:8080
    description: Local Core Server
tags:
  - name: Health
    description: Process liveness and dependency readiness.
  - name: System
    description: Core platform metadata.
  - name: Engineering
    description: Non-domain endpoints used to verify the technical baseline.
  - name: Auth
    description: Users, sessions, and revocable access credentials.
  - name: Projects
    description: Collaborative projects, membership, roles, and permissions.
  - name: Repo
    description: Managed Git repositories, immutable object reads, synchronization, and internal writes.
  - name: Settings
    description: Typed system/project configuration, redacted secrets, and connection tests.
  - name: Jobs
    description: Durable asynchronous jobs and the authenticated Worker protocol.
  - name: Events
    description: Outbox inspection, registered consumers, and explicit replay.
  - name: Data Hub
    description: Cross-module object discovery, activity, and human-confirmed project context.
  - name: Audit
    description: Append-only security/activity audit ingestion and authorized search.
  - name: Observability
    description: Service metrics and diagnostic metadata.
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Check whether the Core process is alive
      operationId: health.live
      security: []
      responses:
        "200":
          description: The Core process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /health/ready:
    get:
      tags: [Health]
      summary: Check Core dependency readiness
      operationId: health.ready
      security: []
      responses:
        "200":
          description: PostgreSQL and object storage are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: One or more dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /openapi.yaml:
    get:
      tags: [System]
      summary: Read the running Core OpenAPI contract
      operationId: system.openapi.get
      security: []
      responses:
        "200":
          description: The canonical Core OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
  /metrics:
    get:
      tags: [Observability]
      summary: Read bounded-label Prometheus metrics
      operationId: observability.metrics.get
      security: []
      responses:
        "200":
          description: Prometheus text exposition for Core.
          content:
            text/plain:
              schema:
                type: string
  /v1/example:
    get:
      tags: [Engineering]
      summary: Verify the example module and PostgreSQL path
      operationId: example.check
      security: []
      responses:
        "200":
          description: PostgreSQL is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleCheck"
        "503":
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      operationId: auth.login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: A revocable browser session was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/register:
    post:
      tags: [Auth]
      summary: Register an active user, optionally through an invitation
      operationId: auth.register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User and browser session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "409":
          $ref: "#/components/responses/Error"
  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current browser session
      operationId: auth.logout
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Resolve the current identity
      operationId: auth.me
      responses:
        "200":
          description: Current authenticated identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Auth]
      summary: Update the current user's profile
      operationId: auth.me.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /v1/auth/me/password:
    post:
      tags: [Auth]
      summary: Change the current user's password
      operationId: auth.me.password.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and other sessions revoked.
  /v1/auth/invitations/preview:
    post:
      tags: [Auth]
      summary: Preview an invitation without consuming it
      operationId: auth.invitations.preview
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: Valid invitation metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectInvitation"
  /v1/auth/invitations/accept:
    post:
      tags: [Auth]
      summary: Accept an invitation as the current user
      operationId: auth.invitations.accept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: Membership created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
  /v1/auth/tokens:
    get:
      tags: [Auth]
      summary: List token metadata owned by the current user
      operationId: auth.tokens.list
      responses:
        "200":
          description: Token metadata without secrets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccessToken"
    post:
      tags: [Auth]
      summary: Issue an API, Agent, or Box token
      operationId: auth.tokens.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token secret returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedToken"
  /v1/auth/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [Auth]
      summary: Revoke an access token
      operationId: auth.tokens.revoke
      responses:
        "204":
          description: Token revoked.
        "404":
          $ref: "#/components/responses/Error"
  /v1/projects:
    get:
      tags: [Projects]
      summary: List projects visible to the current identity
      operationId: projects.list
      parameters:
        - name: include_archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Visible collaborative projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
    post:
      tags: [Projects]
      summary: Create a collaborative project
      operationId: projects.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created with the caller as owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Get a project
      operationId: projects.get
      responses:
        "200":
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Projects]
      summary: Update or archive a project
      operationId: projects.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /v1/projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: List project collaborators
      operationId: projects.members.list
      responses:
        "200":
          description: Project team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
  /v1/projects/{projectId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [Projects]
      summary: Change an existing collaborator's role
      operationId: projects.members.upsert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectMemberRequest"
      responses:
        "200":
          description: Updated collaborator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
    delete:
      tags: [Projects]
      summary: Remove a collaborator
      operationId: projects.members.remove
      responses:
        "204":
          description: Collaborator removed.
        "409":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/invitations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: List project invitations
      operationId: projects.invitations.list
      responses:
        "200":
          description: Project invitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
    post:
      tags: [Projects]
      summary: Invite an email address to the project
      operationId: projects.invitations.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created; token is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedInvitation"
        "409":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Projects]
      summary: Revoke a pending invitation
      operationId: projects.invitations.revoke
      responses:
        "204":
          description: Invitation revoked.
  /v1/projects/{projectId}/permissions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Get the current identity's effective project permissions
      operationId: projects.permissions.get
      responses:
        "200":
          description: Effective role and permission names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPermissions"
  /v1/projects/{projectId}/repository:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Repo]
      summary: Get the managed repository bound to a project
      operationId: repo.get
      responses:
        "200":
          description: Managed repository and workspace status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [Repo]
      summary: Apply a tested repository setting and request initial synchronization
      operationId: repo.connect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoConnectRequest"
      responses:
        "202":
          description: Repository connection accepted for asynchronous synchronization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Repo]
      summary: Disconnect the managed repository without deleting remote Git data
      operationId: repo.disconnect
      responses:
        "204":
          description: Repository disconnected and scheduled for managed cleanup.
        "404":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/repository/test:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Repo]
      summary: Test the saved repo.connection setting and mapped branches
      operationId: repo.connection.test
      responses:
        "200":
          description: Safe provider and branch checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoConnectionTestResult"
  /v1/projects/{projectId}/repository/sync:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Repo]
      summary: Coalesce a manual synchronization request
      operationId: repo.sync.request
      responses:
        "202":
          description: Synchronization request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
  /v1/projects/{projectId}/repository/workspaces:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    patch:
      tags: [Repo]
      summary: Apply three distinct existing remote branch mappings
      operationId: repo.workspaces.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoUpdateWorkspacesRequest"
      responses:
        "202":
          description: Workspace mapping update accepted for synchronization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
  /v1/projects/{projectId}/repository/branches:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Repo]
      summary: List fetched remote branches
      operationId: repo.branches.list
      responses:
        "200":
          description: Remote branches and current workspace mappings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoBranchList"
  /v1/projects/{projectId}/repository/commits:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Repo]
      summary: List immutable commits for one logical workspace
      operationId: repo.commits.list
      parameters:
        - $ref: "#/components/parameters/RepoWorkspace"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/RepoLimit"
      responses:
        "200":
          description: Commit page pinned to the resolved workspace history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoCommitPage"
    post:
      tags: [Repo]
      summary: Apply controlled file changes and push a commit
      description: Internal Core capability. Stage 1 Web BFF and MCP do not expose this operation.
      operationId: repo.commits.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoCreateCommitRequest"
      responses:
        "201":
          description: Commit pushed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoCommitResult"
        "409":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/repository/commits/{commitSha}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/CommitSha"
    get:
      tags: [Repo]
      summary: Get immutable commit metadata and changes
      operationId: repo.commits.get
      responses:
        "200":
          description: Commit detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoCommit"
        "404":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/repository/tree:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Repo]
      summary: List one directory from a fixed commit
      operationId: repo.tree.list
      parameters:
        - $ref: "#/components/parameters/RepoWorkspace"
        - $ref: "#/components/parameters/RepoRevision"
        - $ref: "#/components/parameters/RepoPath"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/RepoLimit"
      responses:
        "200":
          description: One directory page and the full resolved commit SHA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoTreePage"
  /v1/projects/{projectId}/repository/content:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Repo]
      summary: Read one path from a fixed commit
      operationId: repo.content.get
      parameters:
        - $ref: "#/components/parameters/RepoWorkspace"
        - $ref: "#/components/parameters/RepoRevision"
        - $ref: "#/components/parameters/RequiredRepoPath"
      responses:
        "200":
          description: Text content or safe metadata describing a non-previewable object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoFileContent"
  /v1/projects/{projectId}/repository/checkouts:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Repo]
      summary: Create a leased detached checkout for a fixed commit
      operationId: repo.checkouts.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoCreateCheckoutRequest"
      responses:
        "201":
          description: Checkout lease created. Server paths are intentionally omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoCheckout"
  /v1/projects/{projectId}/repository/checkouts/{checkoutId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/CheckoutId"
    get:
      tags: [Repo]
      summary: Get checkout lease metadata
      operationId: repo.checkouts.get
      responses:
        "200":
          description: Checkout lease metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoCheckout"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Repo]
      summary: Release a detached checkout idempotently
      operationId: repo.checkouts.release
      responses:
        "204":
          description: Checkout released or already absent.
  /v1/repo/webhooks/github/{hookId}:
    parameters:
      - $ref: "#/components/parameters/HookId"
    post:
      tags: [Repo]
      summary: Accept a signed GitHub webhook without trusting payload commit data
      operationId: repo.webhooks.github
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Delivery accepted, ignored, or identified as a duplicate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoWebhookAcceptance"
        "401":
          $ref: "#/components/responses/Error"
  /v1/settings/types:
    get:
      tags: [Settings]
      summary: List registered configuration types for a scope
      operationId: settings.types.list
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/SettingScope"
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Module-owned configuration type descriptors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingTypeList"
        "403":
          $ref: "#/components/responses/Error"
  /v1/settings/system/{typeKey}:
    parameters:
      - $ref: "#/components/parameters/TypeKey"
    get:
      tags: [Settings]
      summary: Read a redacted system setting
      operationId: settings.system.get
      responses:
        "200":
          description: Redacted system setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Settings]
      summary: Update a system setting
      operationId: settings.system.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingRequest"
      responses:
        "200":
          description: Updated redacted setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
    delete:
      tags: [Settings]
      summary: Delete a system setting
      operationId: settings.system.delete
      responses:
        "204":
          description: Setting deleted.
  /v1/settings/system/{typeKey}/test:
    parameters:
      - $ref: "#/components/parameters/TypeKey"
    post:
      tags: [Settings]
      summary: Test a saved system configuration
      operationId: settings.system.test
      responses:
        "200":
          description: Safe per-check connection-test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"
  /v1/settings/projects/{projectId}/{typeKey}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TypeKey"
    get:
      tags: [Settings]
      summary: Read a redacted project setting
      operationId: settings.projects.get
      responses:
        "200":
          description: Redacted project setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Settings]
      summary: Update a project setting
      operationId: settings.projects.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingRequest"
      responses:
        "200":
          description: Updated redacted setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
    delete:
      tags: [Settings]
      summary: Delete a project setting
      operationId: settings.projects.delete
      responses:
        "204":
          description: Setting deleted.
  /v1/settings/projects/{projectId}/{typeKey}/test:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TypeKey"
    post:
      tags: [Settings]
      summary: Test a saved project configuration
      operationId: settings.projects.test
      responses:
        "200":
          description: Safe per-check connection-test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"
  /v1/jobs:
    post:
      tags: [Jobs]
      summary: Create an idempotent project job
      operationId: jobs.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "200":
          description: Existing job returned for the same idempotency key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "201":
          description: Job created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /v1/jobs/claim:
    post:
      tags: [Jobs]
      summary: Atomically claim the next eligible job
      description: "Requires an API token. Returns `job: null` when no job is available."
      operationId: jobs.claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimJobRequest"
      responses:
        "200":
          description: Claimed job or an empty poll result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobClaim"
  /v1/jobs/workers/heartbeat:
    post:
      tags: [Jobs]
      summary: Record Worker process liveness and capabilities
      description: Requires an API token.
      operationId: jobs.workers.heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHeartbeatRequest"
      responses:
        "204":
          description: Heartbeat recorded.
  /v1/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [Jobs]
      summary: Read a project job
      operationId: jobs.get
      responses:
        "200":
          description: Authoritative job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Error"
  /v1/jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [Jobs]
      summary: Cancel queued work or signal a running Worker
      operationId: jobs.cancel
      responses:
        "200":
          description: Updated job state or cancellation signal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /v1/jobs/{jobId}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [Jobs]
      summary: Renew a Worker-owned job lease
      description: Requires an API token and returns any cancellation signal.
      operationId: jobs.lease.renew
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewJobLeaseRequest"
      responses:
        "200":
          description: Renewed lease and current job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "409":
          $ref: "#/components/responses/Error"
  /v1/jobs/{jobId}/logs:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [Jobs]
      summary: Read append-only job logs
      operationId: jobs.logs.list
      responses:
        "200":
          description: Ordered job log entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLogList"
    post:
      tags: [Jobs]
      summary: Append a log under an active Worker lease
      description: Requires an API token.
      operationId: jobs.logs.append
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendJobLogRequest"
      responses:
        "201":
          description: Log appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLog"
  /v1/jobs/{jobId}/complete:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [Jobs]
      summary: Submit a successful job result
      description: Requires an API token and an active Worker lease.
      operationId: jobs.complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteJobRequest"
      responses:
        "200":
          description: Terminal job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /v1/jobs/{jobId}/fail:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [Jobs]
      summary: Submit a handler failure
      description: Core applies retry, cancellation, timeout, and max-attempt policy.
      operationId: jobs.fail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailJobRequest"
      responses:
        "200":
          description: Retried or terminal job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /v1/events/test:
    post:
      tags: [Events]
      summary: Enqueue an engineering test event
      description: System administrator endpoint used by foundation smoke checks.
      operationId: events.test.emit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmitTestEventRequest"
      responses:
        "201":
          description: Test event committed to system_outbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventEnqueued"
        "403":
          $ref: "#/components/responses/Error"
  /v1/events/consumers:
    get:
      tags: [Events]
      summary: List registered in-process event consumers
      operationId: events.consumers.list
      responses:
        "200":
          description: Deterministic consumer registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventConsumerList"
  /v1/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      summary: Inspect Outbox publication and consumer delivery state
      operationId: events.get
      responses:
        "200":
          description: Event envelope and all live/replay deliveries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxEventState"
        "404":
          $ref: "#/components/responses/Error"
  /v1/events/{eventId}/replay:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      tags: [Events]
      summary: Explicitly replay an event to one or all matching consumers
      operationId: events.replay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayEventRequest"
      responses:
        "202":
          description: Replay deliveries created with a fresh idempotency key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventReplay"
        "404":
          $ref: "#/components/responses/Error"
  /v1/data/projects/{projectId}/objects:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Data Hub]
      summary: List project objects
      description: Stable `data.list` routing entry point for users and Agents.
      operationId: data.list
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Cursor-paginated object projections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataObjectPage"
        "403":
          $ref: "#/components/responses/Error"
  /v1/data/projects/{projectId}/objects/{objectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: objectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Data Hub]
      summary: Read one project object through its domain adapter
      description: Stable `data.read` routing entry point; full content remains domain-owned.
      operationId: data.read
      responses:
        "200":
          description: Registry projection plus authoritative module content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataObjectRead"
        "404":
          $ref: "#/components/responses/Error"
  /v1/data/projects/{projectId}/activity:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Data Hub]
      summary: List the project activity timeline
      operationId: data.activity.list
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Cursor-paginated activity projections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataActivityPage"
  /v1/data/projects/{projectId}/context:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Data Hub]
      summary: List human-confirmed project context
      operationId: data.context.list
      responses:
        "200":
          description: Formal project context only; pending proposals are excluded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectContextList"
  /v1/data/projects/{projectId}/context/proposals:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Data Hub]
      summary: List context proposals
      operationId: data.context.proposals.list
      responses:
        "200":
          description: Context proposals visible to collaborators who may propose.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextProposalList"
    post:
      tags: [Data Hub]
      summary: Propose information for formal project context
      description: Agents may create proposals but cannot confirm them.
      operationId: data.context.proposals.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContextProposalRequest"
      responses:
        "201":
          description: Pending context proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextProposal"
  /v1/data/projects/{projectId}/context/proposals/{proposalId}/review:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: proposalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Data Hub]
      summary: Accept or reject a context proposal
      description: Requires a human browser session and context-review permission.
      operationId: data.context.proposals.review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewContextProposalRequest"
      responses:
        "200":
          description: Reviewed proposal; acceptance also creates formal context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextProposal"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/data/projects/{projectId}/home:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Data Hub]
      summary: Read the project-home aggregate DTO shell
      operationId: data.home.get
      responses:
        "200":
          description: Typed empty sections ready for future domain contributors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeAggregate"
  /v1/audit/events:
    get:
      tags: [Audit]
      summary: Search the append-only audit trail
      operationId: audit.events.list
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: actor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: category
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
            enum: [success, denied, error]
        - name: source
          in: query
          schema:
            type: string
        - name: request_id
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Cursor-paginated audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [Audit]
      summary: Record an event from a trusted mmdash service
      description: Requires an API or Box token; caller identity is derived by Core.
      operationId: audit.events.record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordAuditEventRequest"
      responses:
        "201":
          description: Immutable audit event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
        "403":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or opaque token
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommitSha:
      name: commitSha
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
    CheckoutId:
      name: checkoutId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HookId:
      name: hookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RepoWorkspace:
      name: workspace
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/RepoWorkspaceKind"
    RepoRevision:
      name: revision
      in: query
      required: true
      description: A full commit SHA after the initial workspace resolution.
      schema:
        type: string
        pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
    RepoPath:
      name: path
      in: query
      required: false
      schema:
        type: string
        maxLength: 4096
        default: ""
    RequiredRepoPath:
      name: path
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
    RepoLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TypeKey:
      name: typeKey
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_.-]*$"
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Stable Core error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    User:
      type: object
      additionalProperties: false
      required: [id, email, display_name, status, system_role, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        system_role:
          type: string
          enum: [admin, member]
        created_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, display_name, password]
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 8
        invitation_token:
          type: string
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
        current_password:
          type: string
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
    InvitationTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    LoginResult:
      type: object
      additionalProperties: false
      required: [access_token, expires_at, session_id, user]
      properties:
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        session_id:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
    Identity:
      type: object
      additionalProperties: false
      required: [kind, user]
      properties:
        kind:
          type: string
          enum: [session, api, agent, box]
        project_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        token_id:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
    AccessToken:
      type: object
      additionalProperties: false
      required: [id, user_id, kind, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [api, agent, box]
        name:
          type: string
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    CreateTokenRequest:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [api, agent, box]
        name:
          type: string
          minLength: 1
        project_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    IssuedToken:
      type: object
      additionalProperties: false
      required: [token, credential]
      properties:
        token:
          type: string
        credential:
          $ref: "#/components/schemas/AccessToken"
    ProjectRole:
      type: string
      enum: [owner, maintainer, editor, viewer, agent, box]
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - problem_title
        - problem_summary
        - project_constraints
        - source_artifact_ids
        - created_by
        - created_at
        - updated_at
        - role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        problem_title:
          type: string
        problem_summary:
          type: string
        project_constraints:
          type: array
          items:
            type: string
        source_artifact_ids:
          type: array
          items:
            type: string
        created_by:
          type: string
          format: uuid
        archived_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        role:
          $ref: "#/components/schemas/ProjectRole"
    ProjectList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        problem_title:
          type: string
        problem_summary:
          type: string
        project_constraints:
          type: array
          items:
            type: string
        source_artifact_ids:
          type: array
          items:
            type: string
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        problem_title:
          type: string
        problem_summary:
          type: string
        project_constraints:
          type: array
          items:
            type: string
        source_artifact_ids:
          type: array
          items:
            type: string
        archived:
          type: boolean
    ProjectMember:
      type: object
      additionalProperties: false
      required: [user_id, email, display_name, role, joined_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/ProjectRole"
        joined_at:
          type: string
          format: date-time
    InvitationStatus:
      type: string
      enum: [pending, accepted, revoked, expired]
    ProjectInvitation:
      type: object
      additionalProperties: false
      required:
        [
          id,
          project_id,
          project_name,
          email,
          role,
          status,
          invited_by,
          expires_at,
          created_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        project_name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/ProjectRole"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        invited_by:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/ProjectRole"
    IssuedInvitation:
      type: object
      additionalProperties: false
      required: [invitation]
      properties:
        invitation:
          $ref: "#/components/schemas/ProjectInvitation"
        token:
          type: string
    InvitationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectInvitation"
    UpdateProjectMemberRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/ProjectRole"
    MemberList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMember"
    ProjectPermissions:
      type: object
      additionalProperties: false
      required: [role, permissions]
      properties:
        role:
          $ref: "#/components/schemas/ProjectRole"
        permissions:
          type: array
          items:
            type: string
    RepoProvider:
      type: string
      enum: [github, local]
    RepoWorkspaceKind:
      type: string
      enum: [code, article, result]
    RepositoryStatus:
      type: string
      enum: [pending, cloning, configuring, ready, syncing, error, disconnected]
    RepoWorkspaceStatus:
      type: string
      enum: [pending, ready, missing, dirty, error]
    RepoWorkspace:
      type: object
      additionalProperties: false
      required:
        [
          workspace,
          remote_branch,
          local_branch,
          head_commit_sha,
          tree_sha,
          status,
          updated_at,
        ]
      properties:
        workspace:
          $ref: "#/components/schemas/RepoWorkspaceKind"
        remote_branch:
          type: string
          minLength: 1
          maxLength: 255
        local_branch:
          type: string
          enum: [mmdash/code, mmdash/article, mmdash/result]
        head_commit_sha:
          type: [string, "null"]
          pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
        tree_sha:
          type: [string, "null"]
          pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
        status:
          $ref: "#/components/schemas/RepoWorkspaceStatus"
        updated_at:
          type: string
          format: date-time
    RepoWebhook:
      type: object
      additionalProperties: false
      required: [hook_id, public_url, secret_configured]
      properties:
        hook_id:
          type: string
          format: uuid
        public_url:
          type: string
        secret_configured:
          type: boolean
        secret:
          description: Returned only when a secret is generated or rotated.
          type: string
    Repository:
      type: object
      additionalProperties: false
      required:
        [
          repository_id,
          project_id,
          provider,
          display_name,
          remote_url,
          default_branch,
