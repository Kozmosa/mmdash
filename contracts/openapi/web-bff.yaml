  /api/projects/{projectId}/repository/test:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Repo]
      summary: Test the saved repository connection
      operationId: bff.repo.connection.test
      responses:
        "200":
          description: Safe provider and branch checks.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/RepoConnectionTestResult"
  /api/projects/{projectId}/repository/sync:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Repo]
      summary: Request repository synchronization
      operationId: bff.repo.sync.request
      responses:
        "202":
          description: Synchronization accepted.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Repository"
  /api/projects/{projectId}/repository/webhook-secret:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Repo]
      summary: Rotate the GitHub webhook secret and return it once
      operationId: bff.repo.webhook-secret.rotate
      responses:
        "200":
          description: Repository status with the newly generated secret included once.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Repository"
  /api/projects/{projectId}/repository/workspaces:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    patch:
      tags: [Repo]
      summary: Update logical workspace branch mappings
      operationId: bff.repo.workspaces.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/RepoUpdateWorkspacesRequest"
      responses:
        "202":
          description: Mapping update accepted.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Repository"
  /api/projects/{projectId}/repository/branches:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Repo]
      summary: List fetched remote branches
      operationId: bff.repo.branches.list
      responses:
        "200":
          description: Remote branches.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/RepoBranchList"
  /api/projects/{projectId}/repository/commits:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Repo]
      summary: List immutable commits for one workspace
      operationId: bff.repo.commits.list
      parameters:
        - name: workspace
          in: query
          required: true
          schema:
            $ref: "./core.yaml#/components/schemas/RepoWorkspaceKind"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Commit page.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/RepoCommitPage"
  /api/projects/{projectId}/repository/commits/{commitSha}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: commitSha
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
    get:
      tags: [Repo]
      summary: Get immutable commit detail
      operationId: bff.repo.commits.get
      responses:
        "200":
          description: Commit detail.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/RepoCommit"
  /api/projects/{projectId}/repository/tree:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Repo]
      summary: List one directory at a fixed commit SHA
      operationId: bff.repo.tree.list
      parameters:
        - name: workspace
          in: query
          required: true
          schema:
            $ref: "./core.yaml#/components/schemas/RepoWorkspaceKind"
        - name: revision
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
        - name: path
          in: query
          schema:
            type: string
            maxLength: 4096
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: One directory page.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/RepoTreePage"
  /api/projects/{projectId}/repository/content:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Repo]
      summary: Read one path at a fixed commit SHA
      operationId: bff.repo.content.get
      parameters:
        - name: workspace
          in: query
          required: true
          schema:
            $ref: "./core.yaml#/components/schemas/RepoWorkspaceKind"
        - name: revision
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
        - name: path
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 4096
      responses:
        "200":
          description: Text content or safe object metadata.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/RepoFileContent"
  /api/webhooks/github/{hookId}:
    parameters:
      - name: hookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Repo]
      summary: Proxy an unmodified GitHub webhook body and signature headers
      operationId: bff.repo.webhooks.github
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Delivery accepted by Core.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/RepoWebhookAcceptance"
        "401":
          $ref: "#/components/responses/Error"
  /api/projects/{projectId}/pages/{pageId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: pageId
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,63}$"
    get:
      tags: [Pages]
      summary: Load registered fragments for one browser page
      operationId: bff.page.get
      responses:
        "200":
          description: The aggregated browser-safe page projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageAggregation"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/projects/{projectId}/events:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Streams]
      summary: Stream project events from Core with SSE
      operationId: bff.events.stream
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: An unbuffered server-sent event stream.
          headers:
            X-Accel-Buffering:
              schema:
                type: string
                const: "no"
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
  /api/projects/{projectId}/socket:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Streams]
      summary: Open a project WebSocket proxied to Core
      operationId: bff.socket.connect
      x-websocket: true
      responses:
        "101":
          description: WebSocket upgrade accepted.
        "401":
          $ref: "#/components/responses/Error"
  /api/projects/{projectId}/files/{filePath}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: filePath
        in: path
        required: true
        description: Slash-delimited project-relative path. Empty and parent segments are rejected.
        schema:
          type: string
          minLength: 1
    get:
      tags: [Streams]
      summary: Stream a project file from Core
      operationId: bff.file.download
      parameters:
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Full file body.
        "206":
          description: Requested file range.
        "401":
          $ref: "#/components/responses/Error"
    head:
      tags: [Streams]
      summary: Read project file metadata from Core
      operationId: bff.file.head
      responses:
        "200":
          description: File metadata headers without a body.
        "401":
          $ref: "#/components/responses/Error"
    put:
      tags: [Streams]
      summary: Stream a project file upload to Core
      operationId: bff.file.upload
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: File replaced.
        "201":
          description: File created.
        "401":
          $ref: "#/components/responses/Error"
  /api/projects/invitations/{invitationId}/accept:
    post:
      tags: [Auth]
      summary: Accept a matching project invitation from the Inbox
      operationId: bff.projects.invitations.accept_by_id
      parameters: [{ $ref: "./core.yaml#/components/parameters/InvitationId" }]
      responses:
        {
          "200":
            {
              description: Joined member,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          $ref: "./core.yaml#/components/schemas/ProjectMember",
                        },
                    },
                },
            },
        }
  /api/inbox:
    get:
      tags: [Notification]
      summary: List the current user's Inbox
      operationId: bff.notification.inbox.list
      parameters:
        - {
            name: project_id,
            in: query,
            required: false,
            schema: { type: string, format: uuid },
          }
        - {
            name: type_key,
            in: query,
            required: false,
            schema: { type: string },
          }
        - {
            name: read_state,
            in: query,
            required: false,
            schema: { type: string, enum: [read, unread] },
          }
        - {
            name: archived,
            in: query,
            required: false,
            schema: { type: string, enum: [true, false] },
          }
        - {
            name: outcome,
            in: query,
            required: false,
            schema:
              { type: string, enum: [active, resolved, revoked, expired] },
          }
        - {
            name: outcome_group,
            in: query,
            required: false,
            schema: { type: string, enum: [processed] },
          }
        - {
            name: occurred_from,
            in: query,
            required: false,
            schema: { type: string, format: date-time },
          }
        - {
            name: occurred_to,
            in: query,
            required: false,
            schema: { type: string, format: date-time },
          }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 200 },
          }
      responses:
        {
          "200":
            {
              description: Inbox page,
              content:
                {
                  application/json:
                    {
                      schema:
                        { $ref: "./core.yaml#/components/schemas/InboxPage" },
                    },
                },
            },
        }
  /api/inbox/unread-count:
    get:
      tags: [Notification]
      summary: Read Inbox unread count
      operationId: bff.notification.inbox.unread_count
      responses:
        {
          "200":
            {
              description: Count,
              content:
                {
                  application/json:
                    {
                      schema:
                        { $ref: "./core.yaml#/components/schemas/UnreadCount" },
                    },
                },
            },
        }
  /api/inbox/mark-all-read:
    post:
      tags: [Notification]
      summary: Mark Inbox items read
      operationId: bff.notification.inbox.mark_all_read
      requestBody:
        required: false
        content:
          {
            application/json:
              {
                schema:
                  {
                    $ref: "./core.yaml#/components/schemas/MarkAllInboxReadRequest",
                  },
              },
          }
      responses: { "204": { description: Items marked read. } }
  /api/inbox/{inboxItemId}:
    parameters: [{ $ref: "./core.yaml#/components/parameters/InboxItemId" }]
    get:
      tags: [Notification]
      summary: Read an Inbox item
      operationId: bff.notification.inbox.get
      responses:
        {
          "200":
            {
              description: Inbox item,
              content:
                {
                  application/json:
                    {
                      schema:
                        { $ref: "./core.yaml#/components/schemas/InboxItem" },
                    },
                },
            },
        }
    patch:
      tags: [Notification]
      summary: Update Inbox state
      operationId: bff.notification.inbox.update
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    $ref: "./core.yaml#/components/schemas/UpdateInboxRequest",
                  },
              },
          }
      responses:
        {
          "200":
            {
              description: Updated item,
              content:
                {
                  application/json:
                    {
                      schema:
                        { $ref: "./core.yaml#/components/schemas/InboxItem" },
                    },
                },
            },
        }
  /api/projects/{projectId}/notification-channels/{channelKey}:
    parameters:
      - { $ref: "./core.yaml#/components/parameters/ProjectId" }
      - { $ref: "./core.yaml#/components/parameters/NotificationChannelKey" }
    get:
      tags: [Notification]
      summary: Read a project notification channel
      operationId: bff.notification.channels.get
      responses:
        {
          "200":
            {
              description: Channel,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          $ref: "./core.yaml#/components/schemas/NotificationChannel",
                        },
                    },
                },
            },
        }
    patch:
      tags: [Notification]
      summary: Update a project notification channel
      operationId: bff.notification.channels.update
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    $ref: "./core.yaml#/components/schemas/UpdateNotificationChannelRequest",
                  },
              },
          }
      responses:
        {
          "200":
            {
              description: Channel,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          $ref: "./core.yaml#/components/schemas/NotificationChannel",
                        },
                    },
                },
            },
        }
    delete:
      tags: [Notification]
      summary: Remove a project notification channel
      operationId: bff.notification.channels.delete
      responses: { "204": { description: Channel removed. } }
  /api/projects/{projectId}/notification-channels/{channelKey}/test:
    post:
      tags: [Notification]
      summary: Test a notification channel
      operationId: bff.notification.channels.test
      parameters:
        - { $ref: "./core.yaml#/components/parameters/ProjectId" }
        - { $ref: "./core.yaml#/components/parameters/NotificationChannelKey" }
      responses:
        {
          "200":
            {
              description: Connection result,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          $ref: "./core.yaml#/components/schemas/ConnectionTestResult",
                        },
                    },
                },
            },
        }
  /api/projects/{projectId}/notification-rules/{typeKey}:
    parameters:
      - { $ref: "./core.yaml#/components/parameters/ProjectId" }
      - { $ref: "./core.yaml#/components/parameters/NotificationTypeKey" }
    get:
      tags: [Notification]
      summary: Read notification rule
      operationId: bff.notification.rules.get
      responses:
        {
          "200":
            {
              description: Rule,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          $ref: "./core.yaml#/components/schemas/NotificationRule",
                        },
                    },
                },
            },
        }
    put:
      tags: [Notification]
      summary: Update notification rule
      operationId: bff.notification.rules.update
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    $ref: "./core.yaml#/components/schemas/UpdateNotificationRuleRequest",
                  },
              },
          }
      responses:
        {
          "200":
            {
              description: Rule,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          $ref: "./core.yaml#/components/schemas/NotificationRule",
                        },
                    },
                },
            },
        }
  /api/projects/{projectId}/notification-deliveries:
    get:
      tags: [Notification]
      summary: List external delivery diagnostics
      operationId: bff.notification.deliveries.list
      parameters:
        - { $ref: "./core.yaml#/components/parameters/ProjectId" }
        - {
            name: channel_key,
            in: query,
            required: false,
            schema: { type: string },
          }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 200 },
          }
      responses:
        "200":
          description: Delivery page.
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "./core.yaml#/components/schemas/NotificationDeliveryPage",
                    },
                },
            }
  /api/projects/{projectId}/notification-deliveries/{deliveryId}/retry:
    post:
      tags: [Notification]
      summary: Explicitly retry a failed delivery
      operationId: bff.notification.deliveries.retry
      parameters:
        - { $ref: "./core.yaml#/components/parameters/ProjectId" }
        - { $ref: "./core.yaml#/components/parameters/NotificationDeliveryId" }
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    $ref: "./core.yaml#/components/schemas/RetryNotificationDeliveryRequest",
                  },
              },
          }
      responses:
        "200":
          description: Retry delivery.
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "./core.yaml#/components/schemas/NotificationDelivery",
                    },
                },
            }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: mmdash_session
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{1,127}$"
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactUploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactVersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactSignedToken:
      name: signedToken
      in: path
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 4096
    TypeKey:
      name: typeKey
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_.-]*$"
  responses:
    Error:
      description: Stable, browser-safe error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [service, status, version]
      properties:
        service:
          type: string
          const: web-bff
        status:
          type: string
          const: ok
        version:
          type: string
    Readiness:
      type: object
      required: [dependencies, status]
      properties:
        dependencies:
          type: object
          required: [core]
          properties:
            core:
              type: string
              enum: [ready, unavailable]
        status:
          type: string
          enum: [ready, not_ready]
    PageAggregation:
      type: object
      additionalProperties: false
      required: [fragments, page_id, project_id, request_id]
      properties:
        fragments:
          type: object
          additionalProperties: true
        page_id:
          type: string
        project_id:
          type: string
        request_id:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true
security:
  - browserSession: []
