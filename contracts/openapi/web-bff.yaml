openapi: 3.1.0
info:
  title: mmdash Web BFF API
  version: 0.1.0
  description: |
    Browser-facing API served by the Fastify Web BFF. Authenticated operations
    require the signed, HTTP-only mmdash_session cookie.
servers:
  - url: https://mmdash.moe
    description: Public ingress
  - url: http://localhost:3001
    description: Local Web BFF
tags:
  - name: Health
  - name: Engineering
  - name: Auth
  - name: Projects
  - name: Settings
  - name: Repo
  - name: Artifact
  - name: Pages
  - name: Data Hub
  - name: Progress
  - name: Model
  - name: Agent
  - name: Experiment
  - name: Box
  - name: Notification
  - name: Streams
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Check whether the BFF process is alive
      operationId: bff.health.live
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /health/ready:
    get:
      tags: [Health]
      summary: Check whether the BFF and Core dependency are ready
      operationId: bff.health.ready
      security: []
      responses:
        "200":
          description: Core is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Core is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/example:
    get:
      tags: [Engineering]
      summary: Proxy the Core engineering-baseline check
      operationId: bff.example.check
      security: []
      responses:
        "200":
          description: The Core example path is healthy.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ExampleCheck"
        "502":
          $ref: "#/components/responses/Error"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Create a signed browser session
      operationId: bff.auth.login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Browser session cookie created.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "./core.yaml#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
  /api/auth/device/verify:
    post:
      tags: [Auth]
      summary: Approve or deny a CLI device authorization in the browser
      operationId: bff.auth.device.verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/DeviceVerificationRequest"
      responses:
        "204":
          description: Device authorization decision recorded.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register and create a signed browser session
      operationId: bff.auth.register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account and browser session created.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "./core.yaml#/components/schemas/User"
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Read the current browser user
      operationId: bff.auth.me
      responses:
        "200":
          description: Current browser user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "./core.yaml#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Auth]
      summary: Update the current browser user's profile
      operationId: bff.auth.me.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated browser user.
  /api/auth/me/password:
    post:
      tags: [Auth]
      summary: Change the current browser user's password
      operationId: bff.auth.me.password.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed.
  /api/auth/invitations/preview:
    post:
      tags: [Auth]
      summary: Preview a project invitation
      operationId: bff.auth.invitations.preview
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: Invitation metadata.
  /api/auth/invitations/accept:
    post:
      tags: [Auth]
      summary: Accept a project invitation
      operationId: bff.auth.invitations.accept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: Membership created.
  /api/auth/invitations/reject:
    post:
      tags: [Auth]
      summary: Reject a project invitation
      operationId: bff.auth.invitations.reject
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/InvitationTokenRequest"
      responses:
        "204":
          description: Invitation rejected.
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session and clear its cookie
      operationId: bff.auth.logout
      responses:
        "204":
          description: Logged out.
  /api/projects:
    get:
      tags: [Projects]
      summary: List projects visible to the browser user
      operationId: bff.projects.list
      parameters:
        - name: include_archived
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Visible projects.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ProjectList"
    post:
      tags: [Projects]
      summary: Create a collaborative project
      operationId: bff.projects.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Project"
  /api/projects/trash:
    get:
      tags: [Projects]
      summary: List recoverable projects owned by the browser user
      operationId: bff.projects.trash.list
      responses:
        "200":
          description: Projects in the owner's recycle bin.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ProjectList"
  /api/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Get project detail
      operationId: bff.projects.get
      responses:
        "200":
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Project"
    patch:
      tags: [Projects]
      summary: Update or archive a project
      operationId: bff.projects.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Project"
    delete:
      tags: [Projects]
      summary: Move an owned project to the recycle bin
      operationId: bff.projects.trash
      responses:
        "204":
          description: Project moved to the recycle bin.
  /api/projects/{projectId}/restore:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Projects]
      summary: Restore an owned project from the recycle bin
      operationId: bff.projects.restore
      responses:
        "200":
          description: Restored project.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Project"
  /api/projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: List project collaborators
      operationId: bff.projects.members.list
      responses:
        "200":
          description: Project team.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/MemberList"
  /api/projects/{projectId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Projects]
      summary: Change a collaborator's role or transfer ownership
      operationId: bff.projects.members.upsert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/UpdateProjectMemberRequest"
      responses:
        "200":
          description: Updated collaborator.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ProjectMember"
    delete:
      tags: [Projects]
      summary: Remove a non-owner collaborator
      operationId: bff.projects.members.remove
      responses:
        "204":
          description: Collaborator removed.
  /api/projects/{projectId}/invitations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: List project invitations
      operationId: bff.projects.invitations.list
      responses:
        "200":
          description: Invitation list.
    post:
      tags: [Projects]
      summary: Create a project invitation
      operationId: bff.projects.invitations.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created.
        "409":
          $ref: "./core.yaml#/components/responses/Error"
  /api/projects/{projectId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Projects]
      summary: Revoke a project invitation
      operationId: bff.projects.invitations.revoke
      responses:
        "204":
          description: Invitation revoked.
  /api/projects/{projectId}/permissions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Read effective project permissions
      operationId: bff.projects.permissions.get
      responses:
        "200":
          description: Effective role and permissions.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ProjectPermissions"
  /api/projects/{projectId}/context/proposals:
    parameters: [{ $ref: "./core.yaml#/components/parameters/ProjectId" }]
    get:
      tags: [Data Hub]
      summary: List project Context Proposals for human review
      operationId: bff.data.context.proposals.list
      responses:
        "200":
          description: Context Proposals visible to the current collaborator.
          content:
            application/json:
              schema:
                { $ref: "./core.yaml#/components/schemas/ContextProposalList" }
  /api/projects/{projectId}/context/proposals/{proposalId}/review:
    parameters:
      - $ref: "./core.yaml#/components/parameters/ProjectId"
      - name: proposalId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Data Hub]
      summary: Accept or reject a Context Proposal as a human reviewer
      description: Requires a signed browser session and project.context.review.
      operationId: bff.data.context.proposals.review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "./core.yaml#/components/schemas/ReviewContextProposalRequest",
              }
      responses:
        "200":
          description: Reviewed proposal with its original provenance retained.
          content:
            application/json:
              schema:
                { $ref: "./core.yaml#/components/schemas/ContextProposal" }
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/projects/{projectId}/experiments:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Experiment]
      summary: List project experiments
      operationId: bff.experiment.list
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/ExperimentLimit"
        - name: status
          in: query
          required: false
          schema:
            $ref: "./core.yaml#/components/schemas/ExperimentStatus"
      responses:
        "200":
          description: Experiments visible to the current collaborator.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ExperimentPage"
    post:
      tags: [Experiment]
      summary: Create a frozen project experiment
      operationId: bff.experiment.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/CreateExperimentRequest"
      responses:
        "201":
          description: Created experiment.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Experiment"
  /api/projects/{projectId}/experiments/compare:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Experiment]
      summary: Compare bounded experiment result summaries
      operationId: bff.experiment.compare
      parameters:
        - name: experiment_id
          in: query
          required: true
          schema:
            type: array
            minItems: 2
            maxItems: 20
            items:
              type: string
              format: uuid
          style: form
          explode: false
      responses:
        "200":
          description: Comparison rows without buffering result files.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ExperimentComparison"
  /api/projects/{projectId}/experiments/{experimentId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ExperimentId"
    get:
      tags: [Experiment]
      summary: Read one project experiment
      operationId: bff.experiment.get
      responses:
        "200":
          description: Experiment detail.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Experiment"
  /api/projects/{projectId}/experiments/{experimentId}/run:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ExperimentId"
    post:
      tags: [Experiment]
      summary: Queue an experiment idempotently
      operationId: bff.experiment.run
      responses:
        "202":
          description: Queued experiment.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Experiment"
  /api/projects/{projectId}/experiments/{experimentId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ExperimentId"
    post:
      tags: [Experiment]
      summary: Request experiment cancellation
      operationId: bff.experiment.cancel
      responses:
        "202":
          description: Cancellation accepted.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Experiment"
  /api/projects/{projectId}/experiments/{experimentId}/archive:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ExperimentId"
    post:
      tags: [Experiment]
      summary: Archive a terminal experiment
      operationId: bff.experiment.archive
      responses:
        "202":
          description: Archived experiment.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Experiment"
  /api/projects/{projectId}/experiments/{experimentId}/logs:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ExperimentId"
    get:
      tags: [Experiment, Streams]
      summary: Read a bounded experiment log page
      operationId: bff.experiment.logs.list
      parameters:
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Append-only log page.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ExperimentLogPage"
  /api/projects/{projectId}/experiments/{experimentId}/result:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ExperimentId"
    get:
      tags: [Experiment, Artifact]
      summary: Read the primary experiment result pointer
      operationId: bff.result.get
      responses:
        "200":
          description: Result metadata; file content remains on the Artifact boundary.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ResultBundle"
  /api/projects/{projectId}/boxes:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Box]
      summary: List project Boxes
      operationId: bff.box.list
      responses:
        "200":
          description: Box status and capability list.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/BoxList"
  /api/projects/{projectId}/box:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      tags: [Box]
      summary: Bind a Box to a project
      operationId: bff.box.binding.set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/BoxBindingRequest"
      responses:
        "200":
          description: Updated Box binding.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Box"
    delete:
      tags: [Box]
      summary: Remove the project Box binding
      operationId: bff.box.binding.delete
      responses:
        "204":
          description: Binding removed.
  /api/projects/{projectId}/agent-instances:
    parameters: [{ $ref: "./core.yaml#/components/parameters/ProjectId" }]
    get:
      tags: [Agent]
      summary: List project Agent instances
      operationId: bff.agent.instances.list
      responses:
        "200":
          description: Redacted Agent instances.
          content:
            application/json:
              schema: { $ref: "./core.yaml#/components/schemas/AgentInstanceList" }
    post:
      tags: [Agent]
      summary: Create and bind an Agent instance
      operationId: bff.agent.instances.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./core.yaml#/components/schemas/CreateAgentInstanceRequest" }
      responses:
        "201":
          description: Manual provisioning may return a Token once; auto never does.
          content:
            application/json:
              schema: { $ref: "./core.yaml#/components/schemas/AgentInstanceProvisioningResult" }
  /api/projects/{projectId}/agent-instances/{agentInstanceId}:
    parameters:
      - $ref: "./core.yaml#/components/parameters/ProjectId"
      - $ref: "./core.yaml#/components/parameters/AgentInstanceId"
    get:
      tags: [Agent]
      summary: Get an Agent instance
      operationId: bff.agent.instances.get
      responses:
        "200":
          description: Redacted Agent instance.
          content:
            application/json:
              schema: { $ref: "./core.yaml#/components/schemas/AgentInstance" }
    patch:
      tags: [Agent]
      summary: Update Agent configuration
      description: Tool-scope changes start safe Token rotation; the old Token remains active until verification.
      operationId: bff.agent.instances.update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./core.yaml#/components/schemas/UpdateAgentInstanceRequest" }
      responses:
        "200":
          description: Updated instance; manual scope rotation may return the new Token once.
          content:
            application/json:
              schema: { $ref: "./core.yaml#/components/schemas/AgentInstanceProvisioningResult" }
    delete:
      tags: [Agent]
      summary: Disable an Agent instance
      operationId: bff.agent.instances.disable
      responses:
        "204": { description: Instance disabled and credentials revoked. }
  /api/projects/{projectId}/agent-instances/{agentInstanceId}/checks:
    parameters:
      - $ref: "./core.yaml#/components/parameters/ProjectId"
      - $ref: "./core.yaml#/components/parameters/AgentInstanceId"
    post:
      tags: [Agent]
      summary: Run Agent connection and capability checks
      operationId: bff.agent.instances.check
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./core.yaml#/components/schemas/RunAgentChecksRequest" }
      responses:
        "200":
          description: Independent safe check results.
          content:
            application/json:
              schema: { $ref: "./core.yaml#/components/schemas/AgentChecksResult" }
  /api/projects/{projectId}/agent-instances/{agentInstanceId}/project-access/verify:
    parameters:
      - $ref: "./core.yaml#/components/parameters/ProjectId"
      - $ref: "./core.yaml#/components/parameters/AgentInstanceId"
    post:
      tags: [Agent]
      summary: Verify Hermes to mmdash MCP access
      operationId: bff.agent.project_access.verify
      responses:
        "200":
          description: Reverse-connection result.
          content:
            application/json:
              schema: { $ref: "./core.yaml#/components/schemas/AgentProjectAccessVerificationResult" }
  /api/projects/{projectId}/agent-instances/{agentInstanceId}/tokens/rotate:
    parameters:
      - $ref: "./core.yaml#/components/parameters/ProjectId"
      - $ref: "./core.yaml#/components/parameters/AgentInstanceId"
    post:
      tags: [Agent]
      summary: Begin two-phase Agent Token rotation
      operationId: bff.agent.tokens.rotate
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "./core.yaml#/components/schemas/RotateAgentTokenRequest" }
      responses:
        "201":
          description: Rotation state; manual mode may return the Token once.
          content:
            application/json:
              schema: { $ref: "./core.yaml#/components/schemas/AgentTokenRotationResult" }
  /api/projects/{projectId}/agent-instances/{agentInstanceId}/tokens/{tokenId}/verify:
    parameters:
      - $ref: "./core.yaml#/components/parameters/ProjectId"
      - $ref: "./core.yaml#/components/parameters/AgentInstanceId"
      - $ref: "./core.yaml#/components/parameters/AgentTokenId"
    post:
      tags: [Agent]
      summary: Verify and activate a pending Agent Token
      operationId: bff.agent.tokens.verify
      responses:
        "200":
          description: Token activated after actual MCP access.
          content:
            application/json:
              schema: { $ref: "./core.yaml#/components/schemas/AgentTokenVerificationResult" }
  /api/projects/{projectId}/agent-instances/{agentInstanceId}/tokens/{tokenId}/abort:
    parameters:
      - $ref: "./core.yaml#/components/parameters/ProjectId"
      - $ref: "./core.yaml#/components/parameters/AgentInstanceId"
      - $ref: "./core.yaml#/components/parameters/AgentTokenId"
    post:
      tags: [Agent]
      summary: Abort a pending Agent Token rotation
      operationId: bff.agent.tokens.abort
      responses:
        "200":
          description: Pending Token revoked and old Token retained.
          content:
            application/json:
              schema: { $ref: "./core.yaml#/components/schemas/AgentTokenAbortResult" }
  /api/projects/{projectId}/agent-instances/{agentInstanceId}/tokens/{tokenId}:
    parameters:
      - $ref: "./core.yaml#/components/parameters/ProjectId"
      - $ref: "./core.yaml#/components/parameters/AgentInstanceId"
      - $ref: "./core.yaml#/components/parameters/AgentTokenId"
    delete:
      tags: [Agent]
      summary: Immediately revoke an Agent Token
      operationId: bff.agent.tokens.revoke
      responses:
        "204": { description: Agent Token revoked. }
  /api/projects/{projectId}/agent-instances/{agentInstanceId}/prompt:
    parameters:
      - $ref: "./core.yaml#/components/parameters/ProjectId"
      - $ref: "./core.yaml#/components/parameters/AgentInstanceId"
    get:
      tags: [Agent]
      summary: Get generated and effective Agent prompt
