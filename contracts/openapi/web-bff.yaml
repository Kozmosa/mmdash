openapi: 3.1.0
info:
  title: mmdash Web BFF API
  version: 0.1.0
  description: |
    Browser-facing API served by the Fastify Web BFF. Authenticated operations
    require the signed, HTTP-only mmdash_session cookie.
servers:
  - url: https://mmdash.moe
    description: Public ingress
  - url: http://localhost:3001
    description: Local Web BFF
tags:
  - name: Health
  - name: Engineering
  - name: Auth
  - name: Projects
  - name: Settings
  - name: Repo
  - name: Artifact
  - name: Pages
  - name: Streams
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Check whether the BFF process is alive
      operationId: bff.health.live
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /health/ready:
    get:
      tags: [Health]
      summary: Check whether the BFF and Core dependency are ready
      operationId: bff.health.ready
      security: []
      responses:
        "200":
          description: Core is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Core is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/example:
    get:
      tags: [Engineering]
      summary: Proxy the Core engineering-baseline check
      operationId: bff.example.check
      security: []
      responses:
        "200":
          description: The Core example path is healthy.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ExampleCheck"
        "502":
          $ref: "#/components/responses/Error"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Create a signed browser session
      operationId: bff.auth.login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Browser session cookie created.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "./core.yaml#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
  /api/auth/device/verify:
    post:
      tags: [Auth]
      summary: Approve or deny a CLI device authorization in the browser
      operationId: bff.auth.device.verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/DeviceVerificationRequest"
      responses:
        "204":
          description: Device authorization decision recorded.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register and create a signed browser session
      operationId: bff.auth.register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account and browser session created.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "./core.yaml#/components/schemas/User"
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Read the current browser user
      operationId: bff.auth.me
      responses:
        "200":
          description: Current browser user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "./core.yaml#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Auth]
      summary: Update the current browser user's profile
      operationId: bff.auth.me.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated browser user.
  /api/auth/me/password:
    post:
      tags: [Auth]
      summary: Change the current browser user's password
      operationId: bff.auth.me.password.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed.
  /api/auth/invitations/preview:
    post:
      tags: [Auth]
      summary: Preview a project invitation
      operationId: bff.auth.invitations.preview
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: Invitation metadata.
  /api/auth/invitations/accept:
    post:
      tags: [Auth]
      summary: Accept a project invitation
      operationId: bff.auth.invitations.accept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: Membership created.
  /api/auth/invitations/reject:
    post:
      tags: [Auth]
      summary: Reject a project invitation
      operationId: bff.auth.invitations.reject
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/InvitationTokenRequest"
      responses:
        "204":
          description: Invitation rejected.
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session and clear its cookie
      operationId: bff.auth.logout
      responses:
        "204":
          description: Logged out.
  /api/projects:
    get:
      tags: [Projects]
      summary: List projects visible to the browser user
      operationId: bff.projects.list
      parameters:
        - name: include_archived
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Visible projects.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ProjectList"
    post:
      tags: [Projects]
      summary: Create a collaborative project
      operationId: bff.projects.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Project"
  /api/projects/trash:
    get:
      tags: [Projects]
      summary: List recoverable projects owned by the browser user
      operationId: bff.projects.trash.list
      responses:
        "200":
          description: Projects in the owner's recycle bin.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ProjectList"
  /api/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Get project detail
      operationId: bff.projects.get
      responses:
        "200":
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Project"
    patch:
      tags: [Projects]
      summary: Update or archive a project
      operationId: bff.projects.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Project"
    delete:
      tags: [Projects]
      summary: Move an owned project to the recycle bin
      operationId: bff.projects.trash
      responses:
        "204":
          description: Project moved to the recycle bin.
  /api/projects/{projectId}/restore:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Projects]
      summary: Restore an owned project from the recycle bin
      operationId: bff.projects.restore
      responses:
        "200":
          description: Restored project.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Project"
  /api/projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: List project collaborators
      operationId: bff.projects.members.list
      responses:
        "200":
          description: Project team.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/MemberList"
  /api/projects/{projectId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Projects]
      summary: Change a collaborator's role or transfer ownership
      operationId: bff.projects.members.upsert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/UpdateProjectMemberRequest"
      responses:
        "200":
          description: Updated collaborator.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ProjectMember"
    delete:
      tags: [Projects]
      summary: Remove a non-owner collaborator
      operationId: bff.projects.members.remove
      responses:
        "204":
          description: Collaborator removed.
  /api/projects/{projectId}/invitations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: List project invitations
      operationId: bff.projects.invitations.list
      responses:
        "200":
          description: Invitation list.
    post:
      tags: [Projects]
      summary: Create a project invitation
      operationId: bff.projects.invitations.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created.
        "409":
          $ref: "./core.yaml#/components/responses/Error"
  /api/projects/{projectId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Projects]
      summary: Revoke a project invitation
      operationId: bff.projects.invitations.revoke
      responses:
        "204":
          description: Invitation revoked.
  /api/projects/{projectId}/permissions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Read effective project permissions
      operationId: bff.projects.permissions.get
      responses:
        "200":
          description: Effective role and permissions.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ProjectPermissions"
  /api/settings/types:
    get:
      tags: [Settings]
      summary: List registered system configuration types
      operationId: bff.settings.system.types.list
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            const: system
      responses:
        "200":
          description: System configuration type descriptors.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/SettingTypeList"
  /api/settings/system/{typeKey}:
    parameters:
      - $ref: "#/components/parameters/TypeKey"
    get:
      tags: [Settings]
      summary: Read a redacted system setting
      operationId: bff.settings.system.get
      responses:
        "200":
          description: Redacted system setting.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Setting"
    patch:
      tags: [Settings]
      summary: Update a system setting
      operationId: bff.settings.system.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/UpdateSettingRequest"
      responses:
        "200":
          description: Updated redacted setting.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Setting"
    delete:
      tags: [Settings]
      summary: Delete a system setting
      operationId: bff.settings.system.delete
      responses:
        "204":
          description: Setting deleted.
  /api/settings/system/{typeKey}/test:
    parameters:
      - $ref: "#/components/parameters/TypeKey"
    post:
      tags: [Settings]
      summary: Test a saved system configuration
      operationId: bff.settings.system.test
      responses:
        "200":
          description: Safe connection-test result.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ConnectionTestResult"
  /api/projects/{projectId}/settings/types:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Settings]
      summary: List project configuration types
      operationId: bff.settings.projects.types.list
      responses:
        "200":
          description: Project configuration type descriptors.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/SettingTypeList"
  /api/projects/{projectId}/settings/{typeKey}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TypeKey"
    get:
      tags: [Settings]
      summary: Read a redacted project setting
      operationId: bff.settings.projects.get
      responses:
        "200":
          description: Redacted project setting.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Setting"
    patch:
      tags: [Settings]
      summary: Update a project setting
      operationId: bff.settings.projects.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/UpdateSettingRequest"
      responses:
        "200":
          description: Updated redacted setting.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Setting"
    delete:
      tags: [Settings]
      summary: Delete a project setting
      operationId: bff.settings.projects.delete
      responses:
        "204":
          description: Setting deleted.
  /api/projects/{projectId}/settings/{typeKey}/test:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TypeKey"
    post:
      tags: [Settings]
      summary: Test a saved project configuration
      operationId: bff.settings.projects.test
      responses:
        "200":
          description: Safe connection-test result.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ConnectionTestResult"
  /api/projects/{projectId}/artifacts/uploads:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Artifact]
      summary: Initialize a browser multipart Artifact upload
      operationId: bff.artifact.uploads.initialize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/ArtifactInitializeUploadRequest"
      responses:
        "201":
          description: Upload session initialized.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ArtifactUploadSession"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
  /api/projects/{projectId}/artifacts/uploads/{uploadId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactUploadId"
    get:
      tags: [Artifact]
      summary: Recover a browser upload session
      operationId: bff.artifact.uploads.get
      responses:
        "200":
          description: Authorized upload session.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ArtifactUploadSession"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Artifact]
      summary: Cancel a browser multipart upload
      operationId: bff.artifact.uploads.abort
      responses:
        "204":
          description: Upload aborted idempotently.
        "409":
          $ref: "#/components/responses/Error"
  /api/projects/{projectId}/artifacts/uploads/{uploadId}/parts/sign:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactUploadId"
    post:
      tags: [Artifact]
      summary: Sign a bounded batch of multipart parts
      operationId: bff.artifact.uploads.parts.sign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/ArtifactSignPartsRequest"
      responses:
        "200":
          description: Direct or Local proxy transfer grants.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ArtifactPartGrantList"
  /api/projects/{projectId}/artifacts/uploads/{uploadId}/confirm:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactUploadId"
    post:
      tags: [Artifact]
      summary: Confirm multipart state and wait for full verification
      operationId: bff.artifact.uploads.confirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/ArtifactConfirmUploadRequest"
      responses:
        "200":
          description: Already-confirmed Artifact detail.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ArtifactDetail"
        "201":
          description: Verified Artifact detail.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ArtifactDetail"
        "409":
          $ref: "#/components/responses/Error"
  /api/artifact-transfers/{signedToken}:
    parameters:
      - $ref: "#/components/parameters/ArtifactSignedToken"
    get:
      tags: [Artifact]
      summary: Stream a signed Local Artifact download without buffering
      operationId: bff.artifact.transfers.get
      security: []
      responses:
        "200":
          description: No-store byte stream.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "410":
          $ref: "#/components/responses/Error"
    put:
      tags: [Artifact]
      summary: Stream a signed Local multipart part without buffering
      operationId: bff.artifact.transfers.put
      security: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Stream forwarded and consumed.
        "410":
          $ref: "#/components/responses/Error"
  /api/projects/{projectId}/artifacts:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Artifact]
      summary: List active Project Artifacts
      operationId: bff.artifact.list
      parameters:
        - name: kind
          in: query
          schema:
            $ref: "./core.yaml#/components/schemas/ArtifactKind"
        - name: source
          in: query
          schema:
            $ref: "./core.yaml#/components/schemas/ArtifactSource"
        - name: status
          in: query
          schema:
            $ref: "./core.yaml#/components/schemas/ArtifactStatus"
        - name: tag
          in: query
          schema:
            type: string
            maxLength: 64
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Cursor page of active Artifacts.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ArtifactPage"
  /api/projects/{projectId}/artifacts/trash:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Artifact]
      summary: List recoverable trashed Artifacts
      operationId: bff.artifact.trash.list
      parameters:
        - name: kind
          in: query
          schema:
            $ref: "./core.yaml#/components/schemas/ArtifactKind"
        - name: tag
          in: query
          schema:
            type: string
            maxLength: 64
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Cursor page of trashed Artifacts.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ArtifactPage"
  /api/projects/{projectId}/artifacts/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactId"
    get:
      tags: [Artifact]
      summary: Read Artifact detail
      operationId: bff.artifact.get
      responses:
        "200":
          description: Artifact and current Version.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ArtifactDetail"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Artifact]
      summary: Update editable Artifact metadata
      operationId: bff.artifact.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/ArtifactUpdateRequest"
      responses:
        "200":
          description: Updated Artifact detail.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ArtifactDetail"
    delete:
      tags: [Artifact]
      summary: Move an Artifact to recoverable trash
      operationId: bff.artifact.trash
      responses:
        "204":
          description: Artifact moved to trash.
  /api/projects/{projectId}/artifacts/{artifactId}/versions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactId"
    get:
      tags: [Artifact]
      summary: List retained immutable Versions
      operationId: bff.artifact.versions.list
      responses:
        "200":
          description: All immutable Versions.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ArtifactVersionList"
  /api/projects/{projectId}/artifacts/{artifactId}/versions/uploads:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactId"
    post:
      tags: [Artifact]
      summary: Initialize a new immutable Version upload
      operationId: bff.artifact.versions.uploads.initialize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/ArtifactInitializeVersionUploadRequest"
      responses:
        "201":
          description: Pending Version upload session.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ArtifactUploadSession"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
  /api/projects/{projectId}/artifacts/{artifactId}/versions/{versionId}/restore:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactId"
      - $ref: "#/components/parameters/ArtifactVersionId"
    post:
      tags: [Artifact]
      summary: Restore retained bytes as a new immutable Version
      operationId: bff.artifact.versions.restore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/ArtifactRestoreVersionRequest"
      responses:
        "201":
          description: New current Version created.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ArtifactDetail"
  /api/projects/{projectId}/artifacts/{artifactId}/download:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactId"
    post:
      tags: [Artifact]
      summary: Authorize current Version download
      operationId: bff.artifact.download
      responses:
        "200":
          description: Short-lived redirect or Local proxy grant.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ArtifactDownloadGrant"
  /api/projects/{projectId}/artifacts/{artifactId}/versions/{versionId}/download:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactId"
      - $ref: "#/components/parameters/ArtifactVersionId"
    post:
      tags: [Artifact]
      summary: Authorize one retained Version download
      operationId: bff.artifact.versions.download
      responses:
        "200":
          description: Short-lived redirect or Local proxy grant.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ArtifactDownloadGrant"
  /api/projects/{projectId}/artifacts/{artifactId}/versions/{versionId}/previews:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactId"
      - $ref: "#/components/parameters/ArtifactVersionId"
    get:
      tags: [Artifact]
      summary: List preview and structural-summary state
      operationId: bff.artifact.previews.list
      responses:
        "200":
          description: Preview state and short-lived transfers.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ArtifactPreviewList"
  /api/projects/{projectId}/artifacts/{artifactId}/restore:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactId"
    post:
      tags: [Artifact]
      summary: Restore a trashed Artifact
      operationId: bff.artifact.restore
      responses:
        "200":
          description: Restored Artifact detail.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/ArtifactDetail"
  /api/projects/{projectId}/artifacts/{artifactId}/purge:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ArtifactId"
    delete:
      tags: [Artifact]
      summary: Permanently purge a trashed Artifact
      operationId: bff.artifact.purge
      responses:
        "204":
          description: Purged and unreferenced bytes removed.
        "409":
          $ref: "#/components/responses/Error"
  /api/projects/{projectId}/repository:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Repo]
      summary: Get browser-safe managed repository status
      operationId: bff.repo.get
      responses:
        "200":
          description: Managed repository and workspace status.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Repository"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [Repo]
      summary: Apply a tested repository setting
      operationId: bff.repo.connect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/RepoConnectRequest"
      responses:
        "202":
          description: Repository connection accepted.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Repository"
    delete:
      tags: [Repo]
      summary: Disconnect the managed repository
      operationId: bff.repo.disconnect
      responses:
        "204":
          description: Repository disconnected.
  /api/projects/{projectId}/repository/test:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Repo]
      summary: Test the saved repository connection
      operationId: bff.repo.connection.test
      responses:
        "200":
          description: Safe provider and branch checks.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/RepoConnectionTestResult"
  /api/projects/{projectId}/repository/sync:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Repo]
      summary: Request repository synchronization
      operationId: bff.repo.sync.request
      responses:
        "202":
          description: Synchronization accepted.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Repository"
  /api/projects/{projectId}/repository/webhook-secret:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Repo]
      summary: Rotate the GitHub webhook secret and return it once
      operationId: bff.repo.webhook-secret.rotate
      responses:
        "200":
          description: Repository status with the newly generated secret included once.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Repository"
  /api/projects/{projectId}/repository/workspaces:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    patch:
      tags: [Repo]
      summary: Update logical workspace branch mappings
      operationId: bff.repo.workspaces.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./core.yaml#/components/schemas/RepoUpdateWorkspacesRequest"
      responses:
        "202":
          description: Mapping update accepted.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/Repository"
  /api/projects/{projectId}/repository/branches:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Repo]
      summary: List fetched remote branches
      operationId: bff.repo.branches.list
      responses:
        "200":
          description: Remote branches.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/RepoBranchList"
  /api/projects/{projectId}/repository/commits:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Repo]
      summary: List immutable commits for one workspace
      operationId: bff.repo.commits.list
      parameters:
        - name: workspace
          in: query
          required: true
          schema:
            $ref: "./core.yaml#/components/schemas/RepoWorkspaceKind"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Commit page.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/RepoCommitPage"
  /api/projects/{projectId}/repository/commits/{commitSha}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: commitSha
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
    get:
      tags: [Repo]
      summary: Get immutable commit detail
      operationId: bff.repo.commits.get
      responses:
        "200":
          description: Commit detail.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/RepoCommit"
  /api/projects/{projectId}/repository/tree:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Repo]
      summary: List one directory at a fixed commit SHA
      operationId: bff.repo.tree.list
      parameters:
        - name: workspace
          in: query
          required: true
          schema:
            $ref: "./core.yaml#/components/schemas/RepoWorkspaceKind"
        - name: revision
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
        - name: path
          in: query
          schema:
            type: string
            maxLength: 4096
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: One directory page.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/RepoTreePage"
  /api/projects/{projectId}/repository/content:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Repo]
      summary: Read one path at a fixed commit SHA
      operationId: bff.repo.content.get
      parameters:
        - name: workspace
          in: query
          required: true
          schema:
            $ref: "./core.yaml#/components/schemas/RepoWorkspaceKind"
        - name: revision
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$"
        - name: path
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 4096
      responses:
        "200":
          description: Text content or safe object metadata.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/RepoFileContent"
  /api/webhooks/github/{hookId}:
    parameters:
      - name: hookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Repo]
      summary: Proxy an unmodified GitHub webhook body and signature headers
      operationId: bff.repo.webhooks.github
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Delivery accepted by Core.
          content:
            application/json:
              schema:
                $ref: "./core.yaml#/components/schemas/RepoWebhookAcceptance"
        "401":
          $ref: "#/components/responses/Error"
  /api/projects/{projectId}/pages/{pageId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: pageId
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,63}$"
    get:
      tags: [Pages]
      summary: Load registered fragments for one browser page
      operationId: bff.page.get
      responses:
        "200":
          description: The aggregated browser-safe page projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageAggregation"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/projects/{projectId}/events:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Streams]
      summary: Stream project events from Core with SSE
      operationId: bff.events.stream
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: An unbuffered server-sent event stream.
          headers:
            X-Accel-Buffering:
              schema:
                type: string
                const: "no"
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
  /api/projects/{projectId}/socket:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Streams]
      summary: Open a project WebSocket proxied to Core
      operationId: bff.socket.connect
      x-websocket: true
      responses:
        "101":
          description: WebSocket upgrade accepted.
        "401":
          $ref: "#/components/responses/Error"
  /api/projects/{projectId}/files/{filePath}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: filePath
        in: path
        required: true
        description: Slash-delimited project-relative path. Empty and parent segments are rejected.
        schema:
          type: string
          minLength: 1
    get:
      tags: [Streams]
      summary: Stream a project file from Core
      operationId: bff.file.download
      parameters:
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Full file body.
        "206":
          description: Requested file range.
        "401":
          $ref: "#/components/responses/Error"
    head:
      tags: [Streams]
      summary: Read project file metadata from Core
      operationId: bff.file.head
      responses:
        "200":
          description: File metadata headers without a body.
        "401":
          $ref: "#/components/responses/Error"
    put:
      tags: [Streams]
      summary: Stream a project file upload to Core
      operationId: bff.file.upload
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: File replaced.
        "201":
          description: File created.
        "401":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: mmdash_session
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{1,127}$"
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactUploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactVersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactSignedToken:
      name: signedToken
      in: path
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 4096
    TypeKey:
      name: typeKey
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_.-]*$"
  responses:
    Error:
      description: Stable, browser-safe error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [service, status, version]
      properties:
        service:
          type: string
          const: web-bff
        status:
          type: string
          const: ok
        version:
          type: string
    Readiness:
      type: object
      required: [dependencies, status]
      properties:
        dependencies:
          type: object
          required: [core]
          properties:
            core:
              type: string
              enum: [ready, unavailable]
        status:
          type: string
          enum: [ready, not_ready]
    PageAggregation:
      type: object
      additionalProperties: false
      required: [fragments, page_id, project_id, request_id]
      properties:
        fragments:
          type: object
          additionalProperties: true
        page_id:
          type: string
        project_id:
          type: string
        request_id:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true
security:
  - browserSession: []
