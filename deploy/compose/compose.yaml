name: mmdash

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # PostgreSQL 初始数据库名；生产按租户/环境命名策略设置。
      POSTGRES_DB: ${POSTGRES_DB:-mmdash}
      # PostgreSQL 应用账号；生产必须替换开发默认账号，并限制其权限。
      POSTGRES_USER: ${POSTGRES_USER:-mmdash}
      # PostgreSQL 应用账号密码；生产必须使用 Secret 管理器注入的强随机值。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mmdash}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mmdash} -d ${POSTGRES_DB:-mmdash}",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      # MinIO 管理账号；生产必须替换默认值，建议仅用于初始化而非应用访问。
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mmdash}
      # MinIO 管理账号密码；生产必须使用 Secret 管理器注入的强随机值。
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
      MINIO_API_CORS_ALLOW_ORIGIN: ${ARTIFACT_WEB_ORIGIN:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    command: artifact-storage-init
    environment:
      ARTIFACT_STORAGE_BACKEND: minio
      ARTIFACT_WEB_ORIGIN: ${ARTIFACT_WEB_ORIGIN:-http://localhost:3000}
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-mmdash}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-mmdash}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  migrate:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    command: migrate
    environment:
      # 迁移使用的 PostgreSQL DSN；生产必须指向生产数据库并启用 TLS（sslmode=require/verify-full）。
      DATABASE_URL: postgres://${POSTGRES_USER:-mmdash}:${POSTGRES_PASSWORD:-mmdash}@postgres:5432/${POSTGRES_DB:-mmdash}?sslmode=disable
      # 容器内迁移文件目录；生产镜像布局不变时可保留。
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  core:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    environment:
      # Core HTTP 监听地址；容器部署通常可保留，由入口/编排控制暴露端口。
      CORE_ADDR: :8080
      # 容器内 OpenAPI 文件位置；生产镜像布局不变时可保留。
      CORE_OPENAPI_PATH: /app/contracts/openapi/core.yaml
      # 运行版本，写入 health 与 metrics；生产必须设置为实际发布版本/构建号。
      MMDASH_VERSION: ${MMDASH_VERSION:-0.1.0}
      # Webhook 公网基址；生产必须是能从 GitHub 到达的正式 HTTPS 地址。
      MMDASH_PUBLIC_URL: ${MMDASH_PUBLIC_URL:-http://localhost:3000}
      CORE_INTERNAL_URL: http://core:8080
      # Session/API Token 签名密钥；生产必须替换为 Secret 管理器提供的高熵值。
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-auth-jwt-secret-change-before-production}
      # 浏览器和 CLI 的短期访问 Token、可刷新 Session 与设备授权时限。
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-24h}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-720h}
      AUTH_DEVICE_AUTHORIZATION_TTL: ${AUTH_DEVICE_AUTHORIZATION_TTL:-10m}
      AUTH_DEVICE_POLL_INTERVAL: ${AUTH_DEVICE_POLL_INTERVAL:-5s}
      # 首个管理员邮箱；生产必须设置为受控管理员账号。
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-admin@mmdash.local}
      # 首个管理员显示名；生产应设置为实际运维/管理员名称。
      AUTH_BOOTSTRAP_DISPLAY_NAME: ${AUTH_BOOTSTRAP_DISPLAY_NAME:-mmdash Admin}
      # 首个管理员密码；生产必须使用 Secret 管理器注入的强随机值。
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-mmdash-local-admin}
      # Settings AES-GCM 加密主密钥；生产必须替换为稳定的 Secret，轮换需有迁移方案。
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-development-settings-encryption-key-change-me}
      # 生产保持 false；仅本机开发接收器可显式开启，且 Core 仍只允许明确 loopback 主机。
      NOTIFICATION_WEBHOOK_ALLOW_HTTP_LOOPBACK: ${NOTIFICATION_WEBHOOK_ALLOW_HTTP_LOOPBACK:-false}
      # Core 使用的 PostgreSQL DSN；生产必须使用生产主机、账号、密码和 TLS。
      DATABASE_URL: postgres://${POSTGRES_USER:-mmdash}:${POSTGRES_PASSWORD:-mmdash}@postgres:5432/${POSTGRES_DB:-mmdash}?sslmode=disable
      # 空闲数据库连接上限；生产按数据库容量与副本数调优。
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-5}
      # 数据库连接池总上限；生产必须按数据库容量与 Core 副本数调优。
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-20}
      # Progress 到期提醒由 Core 多副本共享 PostgreSQL 租约队列处理。
      PROGRESS_REMINDER_POLL_INTERVAL: ${PROGRESS_REMINDER_POLL_INTERVAL:-1s}
      PROGRESS_REMINDER_BATCH_SIZE: ${PROGRESS_REMINDER_BATCH_SIZE:-20}
      PROGRESS_REMINDER_LEASE: ${PROGRESS_REMINDER_LEASE:-30s}
      PROGRESS_REMINDER_RETRY_DELAY: ${PROGRESS_REMINDER_RETRY_DELAY:-2s}
      # S3/MinIO 服务地址；生产必须替换为受控对象存储的内部 HTTPS 地址。
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      # 对象存储访问账号；生产必须使用最小权限的应用账号，不使用 root 账号。
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-mmdash}
      # 对象存储访问密钥；生产必须使用 Secret 管理器注入。
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
      # 权威 Artifact Bucket；生产应设置为环境专用 Bucket。
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-mmdash}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      ARTIFACT_STORAGE_BACKEND: ${ARTIFACT_STORAGE_BACKEND:-minio}
      ARTIFACT_LOCAL_STORAGE_ROOT: /var/lib/mmdash/artifacts
      ARTIFACT_UPLOAD_MAX_BYTES: ${ARTIFACT_UPLOAD_MAX_BYTES:-10737418240}
      ARTIFACT_PREVIEW_OUTPUT_MAX_BYTES: ${ARTIFACT_PREVIEW_OUTPUT_MAX_BYTES:-4194304}
      ARTIFACT_MULTIPART_PART_BYTES: ${ARTIFACT_MULTIPART_PART_BYTES:-16777216}
      ARTIFACT_MULTIPART_URL_TTL: ${ARTIFACT_MULTIPART_URL_TTL:-15m}
      ARTIFACT_MULTIPART_SESSION_TTL: ${ARTIFACT_MULTIPART_SESSION_TTL:-24h}
      ARTIFACT_STAGING_TTL: ${ARTIFACT_STAGING_TTL:-24h}
      ARTIFACT_STAGING_SWEEP_INTERVAL: ${ARTIFACT_STAGING_SWEEP_INTERVAL:-5m}
      # Core 管理的 Git bare repo、长期 worktree 和临时 checkout 根目录。
      REPO_STORAGE_ROOT: /var/lib/mmdash/repos
      # Local Git Provider allowlist；空值默认禁用。容器路径用冒号分隔。
      REPO_LOCAL_ALLOWED_ROOTS: ${REPO_LOCAL_ALLOWED_ROOTS:-}
      REPO_MAX_CONCURRENT_GIT: ${REPO_MAX_CONCURRENT_GIT:-4}
      REPO_COMMAND_TIMEOUT: ${REPO_COMMAND_TIMEOUT:-2m}
      REPO_CLONE_TIMEOUT: ${REPO_CLONE_TIMEOUT:-15m}
      REPO_SYNC_POLL_INTERVAL: ${REPO_SYNC_POLL_INTERVAL:-2s}
      REPO_SYNC_LEASE: ${REPO_SYNC_LEASE:-20m}
      REPO_CHECKOUT_TTL: ${REPO_CHECKOUT_TTL:-1h}
      REPO_MAX_TEXT_BYTES: ${REPO_MAX_TEXT_BYTES:-1048576}
      REPO_DISCONNECT_GRACE: ${REPO_DISCONNECT_GRACE:-24h}
      REPO_ASKPASS_PATH: /usr/local/bin/mmdash-git-askpass
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "8080:8080"
    volumes:
      - artifact-data:/var/lib/mmdash/artifacts
      - repo-data:/var/lib/mmdash/repos

  web-bff:
    build:
      context: ../..
      dockerfile: apps/web-bff/Dockerfile
    environment:
      # 浏览器会话 Cookie 签名密钥；生产必须替换为 Secret 管理器提供的高熵值。
      BFF_COOKIE_SECRET: ${BFF_COOKIE_SECRET:-local-compose-cookie-secret-change-12345}
      # BFF 监听主机；容器部署通常可保留。
      BFF_HOST: 0.0.0.0
      # BFF 监听端口；生产可保留或按平台端口策略调整。
      BFF_PORT: 3001
      # Core 内部服务地址；生产必须改为实际服务发现/DNS 地址。
      CORE_BASE_URL: http://core:8080
      # BFF 版本；生产必须与发布版本/构建号保持一致。
      MMDASH_VERSION: ${MMDASH_VERSION:-0.1.0}
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "3001:3001"

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        # Next.js 构建期 /api rewrite 目标；生产必须指向实际 BFF 内部地址。
        BFF_INTERNAL_URL: http://web-bff:3001
    environment:
      # Next.js 服务端监听端口；生产可保留或按平台端口策略调整。
      PORT: 3000
      # Next.js 监听主机；容器部署通常可保留。
      HOSTNAME: 0.0.0.0
    depends_on:
      web-bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "3000:3000"

  mcp-gateway:
    build:
      context: ../..
      dockerfile: apps/mcp-gateway/Dockerfile
    environment:
      # Core 内部服务地址；生产必须改为实际服务发现/DNS 地址。
      CORE_BASE_URL: http://core:8080
      # Agent Token 可访问项目范围；生产必须收敛为显式项目 ID，禁止使用 *。
      MCP_AGENT_PROJECTS: ${MCP_AGENT_PROJECTS:-*}
      # Agent 调用鉴权 Token；生产必须使用 Secret 管理器注入的强随机值。
      MCP_AGENT_TOKEN: ${MCP_AGENT_TOKEN:-local-agent-token-change-before-production}
      # Agent 可调用 Tool 范围；生产必须设置最小权限清单，禁止使用 *。
      MCP_AGENT_TOOLS: ${MCP_AGENT_TOOLS:-*}
      # 允许的 Host Header；生产必须仅包含正式域名。
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-mmdash.moe,localhost,127.0.0.1}
      # CORS 允许来源；生产必须仅包含正式 HTTPS 前端域名。
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-https://mmdash.moe,http://localhost:3002}
      # CLI Token 可访问项目范围；生产必须收敛为显式项目 ID，禁止使用 *。
      MCP_CLI_PROJECTS: ${MCP_CLI_PROJECTS:-*}
      # CLI 调用鉴权 Token；生产必须使用 Secret 管理器注入的强随机值。
      MCP_CLI_TOKEN: ${MCP_CLI_TOKEN:-local-cli-token-change-before-production}
      # CLI 可调用 Tool 范围；生产必须设置最小权限清单，禁止使用 *。
      MCP_CLI_TOOLS: ${MCP_CLI_TOOLS:-*}
      # MCP Gateway 监听主机；容器部署通常可保留。
      MCP_GATEWAY_HOST: 0.0.0.0
      # MCP Gateway 监听端口；生产可保留或按平台端口策略调整。
      MCP_GATEWAY_PORT: 3002
      # 写入 Core Audit 的专用 Token；生产启用 MCP 审计时必须由 Core 签发并注入。
      MCP_CORE_ACCESS_TOKEN: ${MCP_CORE_ACCESS_TOKEN:-}
      MCP_CORE_AUDIT_TOKEN: ${MCP_CORE_AUDIT_TOKEN:-}
      # MCP Gateway 版本；生产必须与发布版本/构建号保持一致。
      MMDASH_VERSION: ${MMDASH_VERSION:-0.1.0}
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "3002:3002"

  worker:
    profiles: ["worker"]
    build:
      context: ../..
      dockerfile: workers/mmdash-worker/Dockerfile
    environment:
      # Core 内部服务地址；生产必须改为实际服务发现/DNS 地址。
      MMDASH_CORE_URL: http://core:8080
      # Worker 的 Core API Token；生产必须由 Core 签发、按项目/权限最小化并通过 Secret 注入。
      MMDASH_WORKER_API_TOKEN: ${MMDASH_WORKER_API_TOKEN:-}
      # Worker 实例标识；生产每个副本必须唯一，建议由编排平台注入 Pod/任务 ID。
      MMDASH_WORKER_ID: ${MMDASH_WORKER_ID:-mmdash-worker-1}
      # Job 租约秒数；生产按最长任务执行时间和故障恢复目标调优。
      MMDASH_WORKER_LEASE_SECONDS: ${MMDASH_WORKER_LEASE_SECONDS:-60}
      # 无任务时的轮询间隔秒数；生产按吞吐、延迟与数据库负载调优。
      MMDASH_WORKER_POLL_SECONDS: ${MMDASH_WORKER_POLL_SECONDS:-2}
      MMDASH_PREVIEW_MAX_INPUT_BYTES: ${MMDASH_PREVIEW_MAX_INPUT_BYTES:-134217728}
      MMDASH_PREVIEW_MAX_IMAGE_PIXELS: ${MMDASH_PREVIEW_MAX_IMAGE_PIXELS:-40000000}
      MMDASH_PREVIEW_MAX_PDF_PAGES: ${MMDASH_PREVIEW_MAX_PDF_PAGES:-1000}
      MMDASH_PREVIEW_MAX_PDF_TEXT_PAGES: ${MMDASH_PREVIEW_MAX_PDF_TEXT_PAGES:-20}
      MMDASH_PREVIEW_MAX_CSV_ROWS: ${MMDASH_PREVIEW_MAX_CSV_ROWS:-10000}
      MMDASH_PREVIEW_MAX_CSV_COLUMNS: ${MMDASH_PREVIEW_MAX_CSV_COLUMNS:-256}
      MMDASH_PREVIEW_MAX_SAMPLE_ROWS: ${MMDASH_PREVIEW_MAX_SAMPLE_ROWS:-20}
      MMDASH_PREVIEW_MAX_JSON_BYTES: ${MMDASH_PREVIEW_MAX_JSON_BYTES:-8388608}
      MMDASH_PREVIEW_MAX_TEXT_BYTES: ${MMDASH_PREVIEW_MAX_TEXT_BYTES:-2097152}
      MMDASH_PREVIEW_MAX_TEXT_CHARS: ${MMDASH_PREVIEW_MAX_TEXT_CHARS:-32768}
      MMDASH_PREVIEW_MAX_SUMMARY_BYTES: ${MMDASH_PREVIEW_MAX_SUMMARY_BYTES:-65536}
      MMDASH_PREVIEW_MAX_THUMBNAIL_BYTES: ${MMDASH_PREVIEW_MAX_THUMBNAIL_BYTES:-4194304}
      MMDASH_PREVIEW_THUMBNAIL_DIMENSION: ${MMDASH_PREVIEW_THUMBNAIL_DIMENSION:-512}
      MMDASH_PREVIEW_TIMEOUT_SECONDS: ${MMDASH_PREVIEW_TIMEOUT_SECONDS:-60}
    depends_on:
      core:
        condition: service_healthy

volumes:
  artifact-data:
  postgres-data:
  minio-data:
  repo-data:
