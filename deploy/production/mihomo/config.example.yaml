# Copy outside the repository with mode 0600. The actual upstream provider
# file is deployment secret material and must not be committed.
mixed-port: 17890
bind-address: 0.0.0.0
allow-lan: true
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:19090

profile:
  store-selected: true

proxy-providers:
  upstream:
    type: file
    path: /state/providers/upstream.yaml
    health-check:
      enable: true
      interval: 300
      lazy: true
      url: https://github.com/favicon.ico

proxy-groups:
  - name: MMDASH-REPO-EGRESS
    type: url-test
    use:
      - upstream
    url: https://github.com/favicon.ico
    interval: 300
    tolerance: 100

# Core sends only GitHub API and Git HTTPS traffic to this listener. There is
# deliberately no DIRECT fallback: an unavailable provider fails closed and
# lets the Repo coordinator apply bounded retry.
rules:
  - MATCH,MMDASH-REPO-EGRESS
