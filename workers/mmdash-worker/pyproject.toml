[project]
name = "mmdash-worker"
version = "0.1.0"
description = "Asynchronous worker runtime for mmdash"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pillow>=11.3.0,<13",
  "pymupdf>=1.26.3,<2",
]

[project.scripts]
mmdash-worker = "mmdash_worker.main:main"

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "ruff>=0.12.5",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
